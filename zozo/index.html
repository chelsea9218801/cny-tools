function attachHandlers() {
  document.getElementById("app").addEventListener("click", onClick);
}

function onClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "tab") {
    state.topTab = el.dataset.tab;
    render();
  } else if (action === "load-paste") {
    const text = document.getElementById("paste-area").value;
    const { headers, rows } = parseTsv(text);
    if (headers.length === 0 || rows.length === 0) {
      document.getElementById("paste-error").textContent = "データが読み取れませんでした。見出し行を含むタブ区切りデータを貼り付けてください。";
      return;
    }
    state.rawHeaders = headers;
    state.rawRows = rows;
    state.step = "mapping";
    render();
  } else if (action === "start-over") {
    state.rawHeaders = []; state.rawRows = []; state.columnMapping = null; state.analysisResult = null;
    state.manualUnions = []; state.openAddPicker = null; state.excludedBanbans = [];
    state.manualJoinCandidates = null; state.manualJoinSelections = {};
    state.historicalSelections = {}; state.historicalDismissed = [];
    state.step = "paste";
    render();
  } else if (action === "confirm-batch") {
    if (!state.analysisResult || state.analysisResult.rows.length === 0) {
      alert("処理するデータがありません。");
    } else {
      const pendingIds = getPendingHistoryIds();
      const batches = getConfirmationBatches();
      const nextId = batches.reduce((max, b) => Math.max(max, b.id), 0) + 1;
      // マスタ登録発行では、統合・単独確定したものだけでなく元品番のまま残ったものも
      // 含めて「この回で処理した全行」を出力したいので、行の全スナップショットを保持する。
      const allRows = state.analysisResult.rows.map((r) => ({
        skuKey: r.skuKey, banban: r.banban, originalColor: r.originalColor ?? r.color, size: r.size,
        zozoBanban: r.zozoBanban, color: r.color, zozoSize: r.zozoSize ?? r.size, name: r.name, status: r.status,
      }));
      batches.push({ id: nextId, timestamp: new Date().toISOString(), historyIds: pendingIds, allRows });
      setConfirmationBatches(batches);
      alert(`${allRows.length}件を変換履歴に記録しました。`);
    }
    state.rawHeaders = []; state.rawRows = []; state.columnMapping = null; state.analysisResult = null;
    state.manualUnions = []; state.openAddPicker = null; state.excludedBanbans = [];
    state.manualJoinCandidates = null; state.manualJoinSelections = {};
    state.historicalSelections = {}; state.historicalDismissed = [];
    state.step = "paste";
    render();
  } else if (action === "confirm-mapping") {
    const fields = Object.keys(FIELD_LABELS);
    const mapping = {};
    let allSet = true;
    for (const f of fields) {
      const v = document.getElementById(`map-${f}`).value;
      mapping[f] = v;
      if (!v && !OPTIONAL_FIELDS.has(f)) allSet = false;
    }
    if (!allSet) { alert("すべての必須項目に対応する列を選択してください。"); return; }
    state.columnMapping = mapping;
    const normalized = normalizeRows(state.rawRows, mapping);
    state.analysisResult = analyze(normalized, state.manualUnions, state.excludedBanbans);
    state.step = "analysis";
    render();
  } else if (action === "autogen") {
    const gi = Number(el.dataset.groupIdx);
    const settings = getSettings();
    document.getElementById(`zozo-input-${gi}`).value = suggestZozoBanban(settings.prefix);
  } else if (action === "merge") {
    const gi = Number(el.dataset.groupIdx);
    const group = state.analysisResult.candidateGroups[gi];
    const checks = document.querySelectorAll(`.member-check[data-group-idx="${gi}"]:checked`);
    const members = [...checks].map((c) => {
      const mi = Number(c.dataset.memberIdx);
      const member = group.members[mi];
      const overrideSelect = document.getElementById(`color-override-${gi}-${mi}`);
      const sizeSelect = document.getElementById(`size-override-${gi}-${mi}`);
      return {
        ...member,
        effectiveColor: overrideSelect ? overrideSelect.value : member.color,
        effectiveSize: sizeSelect ? sizeSelect.value : member.size,
      };
    });
    const zozoBanban = document.getElementById(`zozo-input-${gi}`).value.trim();
    const unifiedName = document.getElementById(`unified-name-${gi}`).value.trim();
    if (members.length < 2) { alert("統合するには2件以上選択してください。"); return; }
    if (!zozoBanban) { alert("ZOZO品番を入力してください。"); return; }
    if (!unifiedName) { alert("統一後の品名を入力してください。"); return; }
    const remainingDup = findDuplicateColorSizeKeys(members.map((m) => ({ color: m.effectiveColor, size: m.effectiveSize })));
    if (remainingDup.size > 0) { alert("SKUコード（カラー＋サイズ）が重複したままです。「SKU用カラー」「SKU用サイズ」で異なるコードを選んでから統合してください。"); return; }
    confirmMerge(members, zozoBanban, unifiedName);
    refreshAnalysis();
  } else if (action === "reject") {
    const gi = Number(el.dataset.groupIdx);
    const group = state.analysisResult.candidateGroups[gi];
    confirmStandalone(group.members);
    refreshAnalysis();
  } else if (action === "toggle-add-picker") {
    const gi = Number(el.dataset.groupIdx);
    state.openAddPicker = state.openAddPicker === gi ? null : gi;
    render();
  } else if (action === "add-manual-union") {
    const gi = Number(el.dataset.groupIdx);
    const otherBanban = el.dataset.otherBanban;
    const group = state.analysisResult.candidateGroups[gi];
    const repBanban = group.members[0].banban;
    state.manualUnions.push([repBanban, otherBanban]);
    state.openAddPicker = null;
    refreshAnalysis();
  } else if (action === "reset-manual-unions") {
    if (!confirm("手動結合をすべてリセットしますか？")) return;
    state.manualUnions = [];
    refreshAnalysis();
  } else if (action === "exclude-member") {
    const banban = el.dataset.banban;
    if (!state.excludedBanbans.includes(banban)) state.excludedBanbans.push(banban);
    // 除外した品番が既に手動結合の対象になっていた場合は、その手動結合も解除しておく
    // （外したのにまた自動/手動でくっついたままにならないように）。
    state.manualUnions = state.manualUnions.filter(([a, b]) => a !== banban && b !== banban);
    refreshAnalysis();
  } else if (action === "reset-excluded") {
    if (!confirm("外した品番をすべて元に戻しますか？")) return;
    state.excludedBanbans = [];
    refreshAnalysis();
  } else if (action === "add-selected-to-candidate") {
    const checks = document.querySelectorAll(".output-check:checked");
    const outputRowsData = state.analysisResult.rows;
    const banbans = [...new Set([...checks].map((c) => outputRowsData[Number(c.dataset.rowIdx)].banban))];
    const allUnitBanbans = new Set(state.analysisResult.allUnits.map((u) => u.banban));
    const validBanbans = banbans.filter((b) => allUnitBanbans.has(b));
    if (validBanbans.length < 2) {
      alert("統合候補に追加するには、まだ確定していない行を元品番で2件以上選択してください。");
      return;
    }
    for (let i = 1; i < validBanbans.length; i++) {
      state.manualUnions.push([validBanbans[0], validBanbans[i]]);
    }
    refreshAnalysis();
  } else if (action === "propose-join-existing") {
    const checks = document.querySelectorAll(".output-check:checked");
    if (checks.length === 0) {
      alert("統合済み品番に追加する行をチェックしてください。");
      return;
    }
    const settings = getSettings();
    const mapping = getMapping();
    const mergedReps = buildZozoGroupReps(mapping).filter((r) => r.isMerged);
    if (mergedReps.length === 0) {
      alert("追加先となる統合済みのZOZO品番がまだありません。");
      return;
    }
    const outputRowsData = state.analysisResult.rows;
    // 元品番（banban）単位でまとめる。行ごとの色は既に確定済みならzozo_colorが
    // 入っている可能性があるため、必ずoriginalColor/originalNameの方を使う。
    const byBanban = new Map();
    for (const c of checks) {
      const r = outputRowsData[Number(c.dataset.rowIdx)];
      if (!byBanban.has(r.banban)) byBanban.set(r.banban, []);
      byBanban.get(r.banban).push({
        banban: r.banban, subitem: r.subitem, name: r.originalName ?? r.name,
        color: r.originalColor ?? r.color, size: r.size, skuKey: r.skuKey, price: r.price,
      });
    }
    const candidates = [...byBanban.values()].map((memberRows) => {
      const unit = { banban: memberRows[0].banban, subitem: memberRows[0].subitem, name: memberRows[0].name, price: memberRows[0].price, rows: memberRows };
      let best = null;
      for (const rep of mergedReps) {
        if (rep.subitem !== unit.subitem) continue;
        if (!priceGateOk(unit.price, rep.price)) continue;
        const nameScore = nameSimilarity(unit.name, rep.name);
        const banbanClose = rep.originalBanbans.some((b) => banbanNear(unit.banban, b, settings.banban_threshold));
        if (nameScore >= settings.name_threshold || banbanClose) {
          if (!best || nameScore > best.score) best = { rep, score: nameScore, banbanClose };
        }
      }
      return { unit, suggested: best };
    });
    state.manualJoinCandidates = candidates;
    state.manualJoinSelections = {};
    candidates.forEach((c, ci) => {
      state.manualJoinSelections[ci] = (c.suggested ? c.suggested.rep.zozoBanban : mergedReps[0].zozoBanban);
    });
    render();
  } else if (action === "manual-join-confirm") {
    const ci = Number(el.dataset.candidateIdx);
    const candidate = state.manualJoinCandidates[ci];
    const zozoBanban = state.manualJoinSelections[ci];
    const unifiedName = document.getElementById(`manjoin-name-${ci}`).value.trim();
    if (!unifiedName) { alert("統一後の品名を入力してください。"); return; }
    const mapping = getMapping();

    const members = candidate.unit.rows.map((r, ri) => {
      const overrideSelect = document.getElementById(`manjoin-color-override-${ci}-${ri}`);
      const sizeSelect = document.getElementById(`manjoin-size-override-${ci}-${ri}`);
      return {
        ...r,
        effectiveColor: overrideSelect ? overrideSelect.value : r.color,
        effectiveSize: sizeSelect ? sizeSelect.value : r.size,
      };
    });
    const existingEffective = rep.entries.map((e) => ({ color: e.zozo_color || e.color, size: e.zozo_size || e.size }));
    const combined = [...existingEffective, ...members.map((m) => ({ color: m.effectiveColor, size: m.effectiveSize }))];
    const remainingDup = findDuplicateColorSizeKeys(combined);
    if (remainingDup.size > 0) { alert("SKUコード（カラー＋サイズ）が既存の登録商品と重複したままです。「SKU用カラー」「SKU用サイズ」で異なるコードを選んでから追加してください。"); return; }
    confirmJoinExisting(members, zozoBanban, unifiedName);
    removeManualJoinCandidate(ci);
    refreshAnalysis();
  } else if (action === "manual-join-cancel") {

  } else if (action === "unconfirm-row") {

      return {
        ...r,
        effectiveColor: overrideSelect ? overrideSelect.value : r.color,
        effectiveSize: sizeSelect ? sizeSelect.value : r.size,
      };
    });
    const existingEffective = rep.entries.map((e) => ({ color: e.zozo_color || e.color, size: e.zozo_size || e.size }));
    const combined = [...existingEffective, ...members.map((m) => ({ color: m.effectiveColor, size: m.effectiveSize }))];
    const remainingDup = findDuplicateColorSizeKeys(combined);
    if (remainingDup.size > 0) { alert("SKUコード（カラー＋サイズ）が既存の登録商品と重複したままです。「SKU用カラー」「SKU用サイズ」で異なるコードを選んでから統合してください。"); return; }
    confirmJoinExisting(members, rep.zozoBanban, unifiedName);
    delete state.historicalSelections[unitKey];
    refreshAnalysis();
  } else if (action === "reject-historical") {
    state.historicalDismissed.push(el.dataset.unitBanban);

    document.getElementById(`hist-name-${el.dataset.unitBanban}`).value = el.dataset.repName;
  } else if (action === "manjoin-use-rep-name") {
    document.getElementById(`manjoin-name-${el.dataset.candidateIdx}`).value = el.dataset.repName;
  } else if (action === "copy-output") {
    const tsv = toTsv(OUTPUT_HEADERS, state.analysisResult.rows.map(toOutputRow));
    copyToClipboard(tsv);
  } else if (action === "download-output") {
    const tsv = toTsv(OUTPUT_HEADERS, state.analysisResult.rows.map(toOutputRow));
    downloadFile(`zozo_banban_output_${Date.now()}.tsv`, tsv, "text/tab-separated-values;charset=utf-8");
  } else if (action === "delete-history") {
    if (!confirm("この履歴を削除しますか？対象SKUのマッピング（確定済みステータス）も解除され、同じデータを貼り付け直すと未確定に戻ります。")) return;
    const id = Number(el.dataset.id);
    const entry = getHistory().find((h) => h.id === id);
    if (entry) removeMappingForSkuKeys(entry.sku_keys);
    setHistory(getHistory().filter((h) => h.id !== id));

      alert(`${restoredCount}件のSKUをマッピングに復元しました。サブアイテム・上代は履歴に保存されていないため空欄になっています。必要に応じて「振替を編集」から補ってください。`);

    if (!newBanban) { alert("ZOZO品番を入力してください。"); return; }
    const newName = document.getElementById("edit-name").value.trim() || mapping[idx].name;
    const newColor = document.getElementById("edit-zozo-color").value;
    const newSize = document.getElementById("edit-zozo-size").value;
    const newOverride = document.getElementById("edit-sku-override").value.trim();
    mapping[idx] = {
      ...mapping[idx], zozo_banban: newBanban, name: newName, zozo_color: newColor, zozo_size: newSize,
      sku_code_override: newOverride || null,
    };
    setMapping(mapping);
    state.editingMappingKey = null;
    refreshAnalysisIfActive();
  } else if (action === "search-registered") {
    state.registeredFilter = document.getElementById("registered-filter-input").value;
    render();
  } else if (action === "clear-registered-filter") {
    state.registeredFilter = "";
    render();
  } else if (action === "delete-registered-sku") {
    if (!confirm("このSKUの登録を削除しますか？確定前の状態に戻り、同じデータを貼り付け直すと未確定として扱われます（変換履歴の記録はそのまま残ります）。")) return;
    removeMappingForSkuKeys([el.dataset.skuKey]);
    refreshAnalysisIfActive();
  } else if (action === "delete-selected-registered") {
    const checks = document.querySelectorAll(".registered-check:checked");
    if (checks.length === 0) { alert("削除する行をチェックしてください。"); return; }
    const skuKeys = [...checks].map((c) => c.dataset.skuKey);
    if (!confirm(`選択した${skuKeys.length}件のSKUの登録を削除しますか？確定前の状態に戻り、同じデータを貼り付け直すと未確定として扱われます（変換履歴の記録はそのまま残ります）。`)) return;
    removeMappingForSkuKeys(skuKeys);
    refreshAnalysisIfActive();
  } else if (action === "delete-history-batch") {
    if (!confirm("このバッチと、その中の統合・単独確定データをすべて削除します。対象SKUのマッピングも解除され、同じデータを貼り付け直すと未確定に戻ります。よろしいですか？")) return;
    const batchId = Number(el.dataset.batchId);
    const batch = getConfirmationBatches().find((b) => b.id === batchId);
    if (batch) {
      const idsToRemove = new Set(batch.historyIds);
      const entries = getHistory().filter((h) => idsToRemove.has(h.id));
      removeMappingForSkuKeys(entries.flatMap((h) => h.sku_keys));
      setHistory(getHistory().filter((h) => !idsToRemove.has(h.id)));
    }
    setConfirmationBatches(getConfirmationBatches().filter((b) => b.id !== batchId));
    refreshAnalysisIfActive();
  } else if (action === "generate-master-for-batch") {
    tcGenerateMasterRegistrationForBatch(Number(el.dataset.batchId));
  } else if (action === "save-settings") {
    const settings = {
      banban_threshold: Number(document.getElementById("setting-banban-threshold").value) || DEFAULT_SETTINGS.banban_threshold,
      name_threshold: Number(document.getElementById("setting-name-threshold").value) || DEFAULT_SETTINGS.name_threshold,
      prefix: document.getElementById("setting-prefix").value || DEFAULT_SETTINGS.prefix,
    };
    setSettings(settings);
    const msg = document.getElementById("settings-saved-msg");
    msg.textContent = "保存しました。";
    setTimeout(() => { if (msg) msg.textContent = ""; }, 1500);
  } else if (action === "sales-clear") {
    state.sales.files = []; state.sales.error = "";
    render();
  } else if (action === "sales-remove") {
    state.sales.files.splice(Number(el.dataset.idx), 1);
    render();
  } else if (action === "sales-download") {
    const result = salesConvert(state.sales.files);
    if (result.rows.length === 0) { alert("変換するデータがありません。"); return; }
    const csv = salesToCsv(result.rows, state.sales.header);
    let content;
    if (state.sales.encoding === "sjis") {
      const enc = salesEncodeShiftJis(csv);
      if (enc.unmapped.length > 0) alert(`Shift-JISに変換できない文字が含まれていたため「?」に置き換えました: ${[...new Set(enc.unmapped)].join(" ")}`);
      content = enc.bytes;
    } else {
      content = "﻿" + csv;
    }
    downloadFile(salesOutputFileName(result), content, state.sales.encoding === "sjis" ? "text/csv;charset=shift_jis" : "text/csv;charset=utf-8");
  } else if (action === "sales-copy") {
    const result = salesConvert(state.sales.files);
    const lines = result.rows.map((r) => r.join("\t"));
    if (state.sales.header) lines.unshift(SALES_OUT_HEADERS.join("\t"));
    copyToClipboard(lines.join("\n"));
  } else if (action === "cloud-pick") {
    cloudPick();
  } else if (action === "cloud-create") {
    cloudCreate();
  } else if (action === "cloud-read") {
    cloudRead(false);
  } else if (action === "cloud-write") {
    cloudWrite();
  } else if (action === "cloud-unlink") {
    if (!confirm("ドライブ連携を解除しますか？（ドライブ上のデータは消えません。このPCのデータもそのまま残ります）")) return;
    cloudUnlink();
  } else if (action === "backup-data") {
    const backup = buildBackupObject();
    downloadFile(`zozo_banban_backup_${Date.now()}.json`, JSON.stringify(backup, null, 2), "application/json");
  } else if (action === "restore-data") {
    document.getElementById("restore-file-input").click();
  } else if (action === "full-reset") {
    if (!confirm("全データを完全に削除します。設定・マッピング・変換履歴（確定バッチ含む）・登録済みZOZOマスタ・マスタ登録発行済みSKU・カラー/サイズマスタ・納品書番号が全て消えます。元に戻せません。よろしいですか？")) return;
    localStorage.removeItem(STORAGE_KEYS.settings);
    localStorage.removeItem(STORAGE_KEYS.mapping);
    localStorage.removeItem(STORAGE_KEYS.history);
    localStorage.removeItem(STORAGE_KEYS.registered);
    localStorage.removeItem("colorMaster");
    localStorage.removeItem("sizeMaster");
    localStorage.removeItem("cny_invoice_seq");
    localStorage.removeItem(TC_MASTER_HISTORY_KEY);
    localStorage.removeItem(STORAGE_KEYS.batches);
    [CLOUD.KEY_FILE_ID, CLOUD.KEY_SYNCED, CLOUD.KEY_DIRTY, CLOUD.KEY_CONSENTED].forEach((k) => localStorage.removeItem(k));
    alert("全データを削除しました。");
    location.reload();
  } else if (action === "tagsubtab") {
    state.tagSubTab = el.dataset.sub;
    render();
  } else if (action === "tc-convert") {
    const text = document.getElementById("tc-input-area").value;
    const result = tcConvert(text);
    if (result.rowNum === 0) { alert("変換できるデータがありませんでした。入力形式を確認してください。"); return; }
    state.tcResult = result;
    render();
  } else if (action === "tc-clear") {
    state.tcResult = null;
    render();
  } else if (action === "tc-copy") {
    const headers = ["呼び出しNo.", "呼び出しデータ名", "検索用呼び出し名", "メーカー", "品番", "JANコード", "ZOZOカラーID", "ZOZOサイズID", "SKUコード", "カラー名", "サイズ名"];
    const lines = [headers.join("\t"), ...state.tcResult.rows.map((r) => r.join("\t"))];
    copyToClipboard(lines.join("\n"));
  } else if (action === "tc-generate-invoice") {
    const invoiceNo = document.getElementById("tc-invoice-no").value.trim();
    tcGenerateInvoice(state.tcResult.invoiceRows, invoiceNo);
  } else if (action === "delete-master-history") {
    if (!confirm("この履歴を削除しますか？")) return;
    const id = Number(el.dataset.id);
    tcSetMasterOutputHistory(tcGetMasterOutputHistory().filter((h) => h.id !== id));
    render();
  } else if (action === "clear-master-history") {
    if (!confirm("マスタ出力履歴をすべて削除します。よろしいですか？")) return;
    tcSetMasterOutputHistory([]);
    render();
  } else if (action === "tc-add-color-row") {
    tcAddColorRow();
  } else if (action === "tc-add-size-row") {
    tcAddSizeRow();
  } else if (action === "tc-save-master") {
    tcSaveMasterFromUI();
  } else if (action === "tc-delete-row") {
    el.closest("tr").remove();
  }
}

document.addEventListener("change", (e) => {
  if (e.target.id === "sales-file-input") {
    salesAddFiles([...e.target.files]);
    return;
  }
  if (e.target.id === "sales-header") { state.sales.header = e.target.checked; return; }
  if (e.target.id === "sales-encoding") { state.sales.encoding = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.action === "manual-join-select") {
    const ci = Number(e.target.dataset.candidateIdx);
    state.manualJoinSelections[ci] = e.target.value;
    render();
    return;
  }
  if (e.target.dataset && e.target.dataset.action === "hist-select") {
    state.historicalSelections[e.target.dataset.unitBanban] = e.target.value;
    render();
    return;
  }
  if (e.target.classList && e.target.classList.contains("member-check")) {
    const gi = Number(e.target.dataset.groupIdx);
    const group = state.analysisResult.candidateGroups[gi];
    const checks = document.querySelectorAll(`.member-check[data-group-idx="${gi}"]:checked`);
    const names = [...checks].map((c) => group.members[Number(c.dataset.memberIdx)].name);
    const preview = document.getElementById(`unified-name-${gi}`);
    if (preview) preview.value = commonNamePrefix(names);
    return;
  }
  if (e.target.id === "restore-file-input" && e.target.files[0]) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!confirm("現在のデータを上書きして復元します。よろしいですか？")) return;
        applyBackupObject(data);
        alert("復元しました。");
        render();
      } catch (err) {
        alert("ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。");
      }
    };
    reader.readAsText(file);
  }
});

runMigrations();
render();
cloudStartup();
</script>
</body>
</html>
