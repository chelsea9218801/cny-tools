<style>

<script>
"use strict";

/* ================= storage ================= */
const STORAGE_KEYS = {
  settings: "zozo_settings", mapping: "zozo_mapping", history: "zozo_history", registered: "zozo_registered_banbans",
  batches: "zozo_confirmation_batches",
};
const DEFAULT_SETTINGS = { banban_threshold: 30, name_threshold: 0.7, prefix: "ZZ-" };

// Googleドライブ連携（詳細は下の「Googleドライブ連携」節）。クライアントID等は cny-tools と共通。
// drive.file は審査不要の権限で、このアプリが作成した／ピッカーで選ばれたファイルだけにアクセスできる。
const CLOUD = {
  CLIENT_ID: "81398292198-0gu33c2pvt93db3jodarsku68intriq5.apps.googleusercontent.com",
  PROJECT_NUMBER: "81398292198",
  API_KEY: "AIzaSyCSpaU_6zqWKFQoSQXU-Kbd-1q-QbuxanE", // ピッカー用。tools.chelsea-ny.com からのアクセスのみに制限済み
  SCOPE: "https://www.googleapis.com/auth/drive.file",
  FILE_NAME: "zozo-banban-data.json",
  KEY_FILE_ID: "zozo_cloud_file_id",
  KEY_SYNCED: "zozo_cloud_synced_modified",
  KEY_DIRTY: "zozo_cloud_dirty",
  KEY_CONSENTED: "zozo_cloud_consented",
};
// ドライブから読み込んだ内容をローカルに反映している間は「未書き込みの変更」扱いにしない
let cloudApplying = false;
function markCloudDirty() {
  if (!cloudApplying) localStorage.setItem(CLOUD.KEY_DIRTY, "1");
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); markCloudDirty(); }

function getSettings() { return { ...DEFAULT_SETTINGS, ...loadJSON(STORAGE_KEYS.settings, {}) }; }
function setSettings(s) { saveJSON(STORAGE_KEYS.settings, s); }
function getMapping() { return loadJSON(STORAGE_KEYS.mapping, []); }
function setMapping(m) { saveJSON(STORAGE_KEYS.mapping, m); }
function getHistory() { return loadJSON(STORAGE_KEYS.history, []); }
function setHistory(h) { saveJSON(STORAGE_KEYS.history, h); }
function getRegisteredBanbans() { return loadJSON(STORAGE_KEYS.registered, []); }
function setRegisteredBanbans(list) { saveJSON(STORAGE_KEYS.registered, list); }

// 変換履歴は「確定」ボタンを押すたびに1バッチとして束ねる。history自体は
// これまで通り統合アクション1件ごとに1エントリだが、どのバッチに属すかは
// このbatches側で管理する（historyの構造自体は変えない）。
function getConfirmationBatches() { return loadJSON(STORAGE_KEYS.batches, []); }
function setConfirmationBatches(batches) { saveJSON(STORAGE_KEYS.batches, batches); }
function getBatchedHistoryIdSet() {
  const set = new Set();
  getConfirmationBatches().forEach((b) => b.historyIds.forEach((id) => set.add(id)));
  return set;
}
function getPendingHistoryIds() {
  const batched = getBatchedHistoryIdSet();
  return getHistory().filter((h) => !batched.has(h.id)).map((h) => h.id);
}
function getHistoryEntriesForBatch(batchId) {
  const batch = getConfirmationBatches().find((b) => b.id === batchId);
  if (!batch) return [];
  const idSet = new Set(batch.historyIds);
  return getHistory().filter((h) => idSet.has(h.id));
}
// 変換履歴を削除するときは、対応するマッピング（＝確定済みステータスの実体）も
// 一緒に消さないと、同じ元データを再度貼り付けたときに「確定済み」のまま戻せなくなる。
function removeMappingForSkuKeys(skuKeys) {
  const skuKeySet = new Set(skuKeys);
  const remaining = getMapping()
    .filter((m) => !skuKeySet.has(m.sku_key))
    .map((m) => ({ ...m, merged_with: (m.merged_with || []).filter((k) => !skuKeySet.has(k)) }));
  setMapping(remaining);
}
// 確定解除（mappingから削除）されたSKUを、変換履歴（history）の記録から復元する。
// カラー・サイズはhistory側の配列に頼らず、SKUキー自体（元品番-カラー-サイズ）の末尾2要素
// から直接復元する（history.original_banbansは過去の実装差異でsku_keys/namesと要素数が
// ずれていることがあり、それに頼ると別のSKUの元品番を誤って参照してしまうため）。
// 品名はhistory.namesから、無ければZOZO品番から、それも無ければ「品名不明」であることが
// 一目で分かるプレースホルダーにする（サイレントに空欄のまま気づかれないことを避けるため）。
// サブアイテム・上代はhistoryに保存されていないため空欄になる（品番統合のマッチング精度には
// 影響するが、タグ発行・納品書のSKU組み立てには影響しない）。同じSKUキーの履歴が複数ある
// 場合は一番新しいものを使う。既にmappingに存在するSKUキーはスキップする（上書きしない）。
function restoreMappingFromHistory(skuKeys) {
  const history = getHistory();
  let mapping = getMapping();
  const existingKeys = new Set(mapping.map((m) => m.sku_key));
  let restoredCount = 0;
  for (const sk of skuKeys) {
    if (existingKeys.has(sk)) continue;
    const candidates = history
      .filter((h) => Array.isArray(h.sku_keys) && h.sku_keys.includes(sk))
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const entry = candidates[0];
    const skParts = sk.split("-");
    const size = skParts.length >= 2 ? skParts[skParts.length - 1] : "";
    const color = skParts.length >= 3 ? skParts[skParts.length - 2] : "";
    const banbanFromKey = skParts.length >= 3 ? skParts.slice(0, -2).join("-") : sk;
    let banbanFromHistory = "", nameFromHistory = "", zozoBanban = "", timestamp = new Date().toISOString();
    if (entry) {
      const i = entry.sku_keys.indexOf(sk);
      banbanFromHistory = (Array.isArray(entry.original_banbans) && (entry.original_banbans[i] || entry.original_banbans[0])) || "";
      nameFromHistory = (Array.isArray(entry.names) && (entry.names[i] || entry.names[0])) || "";
      zozoBanban = entry.zozo_banban || "";
      timestamp = entry.timestamp || timestamp;
    }
    const banban = banbanFromHistory || banbanFromKey;
    const name = nameFromHistory || zozoBanban || `(復元・品名不明: ${sk})`;
    mapping.push({
      sku_key: sk, zozo_banban: zozoBanban || banban, sqg_banban: banban, subitem: "",
      color, zozo_color: color, size, zozo_size: size, name, original_name: name,
      merged_with: [], confirmed_at: timestamp,
    });
    existingKeys.add(sk);
    restoredCount++;
  }
  // 復元後、同じZOZO品番を共有するSKU同士のmerged_withを実態に合わせて付け直す
  const byBanban = new Map();
  mapping.forEach((m) => {
    if (!byBanban.has(m.zozo_banban)) byBanban.set(m.zozo_banban, []);
    byBanban.get(m.zozo_banban).push(m.sku_key);
  });
  mapping = mapping.map((m) => {
    const siblings = byBanban.get(m.zozo_banban) || [];
    return siblings.length > 1 ? { ...m, merged_with: siblings.filter((k) => k !== m.sku_key) } : m;
  });
  setMapping(mapping);
  return restoredCount;
}
// 移行措置：このバッチ機能を導入する前から溜まっていた履歴を、まとめて
// 1つの確定バッチ（2026/7/7 17:00）として1回だけ登録する。
function runMigrations() {
  const batches = getConfirmationBatches();
  const hist = getHistory();
  if (batches.length === 0 && hist.length > 0) {
    setConfirmationBatches([{ id: 1, timestamp: "2026-07-07T17:00:00", historyIds: hist.map((h) => h.id) }]);
  }
}

/* ================= tsv helpers ================= */
function parseTsv(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n").filter((l) => l.length > 0);
  if (lines.length === 0) return { headers: [], rows: [] };
  const headers = lines[0].split("\t").map((h) => h.trim());
  const rows = lines.slice(1).map((line) => {
    const cells = line.split("\t");
    const row = {};
    headers.forEach((h, i) => { row[h] = (cells[i] ?? "").trim(); });
    return row;
  });
  return { headers, rows };
}
function toTsv(headers, rows) {
  const lines = [headers.join("\t")];
  for (const row of rows) lines.push(headers.map((h) => row[h] ?? "").join("\t"));
  return lines.join("\n");
}

/* ================= ZOZO master (already-registered) parsing ================= */
function parseRegisteredBanbans(text) {
  const { headers, rows } = parseTsv(text);
  const col = headers.find((h) => h === "ブランド品番") || headers.find((h) => h.includes("ブランド品番"));
  if (!col) return null;
  return [...new Set(rows.map((r) => r[col]).filter(Boolean))];
}

/* ================= column guess ================= */
const FIELD_LABELS = {
  banban: "元品番", name: "品名", subitem: "サブアイテム（分類）",
  color: "カラーコード", size: "サイズコード", price: "上代（税抜・任意）",
};
// priceは統合候補の絶対条件（上代一致）に使うが、データに無い場合もあるため必須列にはしない。
const OPTIONAL_FIELDS = new Set(["price"]);
const FIELD_KEYWORDS = {
  banban: ["品番"], name: ["商品名", "品名"], subitem: ["アイテム", "サブアイテム", "分類"],
  color: ["カラー", "色"], size: ["サイズ"], price: ["上代", "単価", "税抜"],
};
function guessMapping(headers) {
  const mapping = {};
  for (const field of Object.keys(FIELD_KEYWORDS)) {
    const keywords = FIELD_KEYWORDS[field];
    mapping[field] = headers.find((h) => keywords.some((k) => h.includes(k))) || "";
  }
  return mapping;
}

/* ================= matching logic (per 開発指示書 section 3) ================= */
function parseBanban(banban) {
  const s = banban || "";
  // 末尾が数字で終わらない品番（例: "134-BCH-S80252-XL" のようなサイズ違いの
  // サフィックス付き）も、短い英数字サフィックスなら無視して番号近さ判定できるようにする。
  const m = /^(.*?)(\d+)(-[A-Za-z0-9]{1,4})?$/.exec(s);
  if (!m) return { prefix: s, num: null };
  return { prefix: m[1], num: parseInt(m[2], 10) };
}
function banbanNear(a, b, threshold) {
  const pa = parseBanban(a), pb = parseBanban(b);
  if (pa.prefix !== pb.prefix || pa.num === null || pb.num === null) return false;
  return Math.abs(pa.num - pb.num) <= threshold;
}
function normalizeStr(s) {
  if (!s) return "";
  return s.normalize("NFKC").trim().replace(/\s+/g, "");
}
function nameSimilarity(a, b) {
  // 先頭からの連続一致文字数 ÷ 短い方の文字数。「BIG」等の語尾違いだけの品名を
  // 高スコアで拾い、語順の入れ替わりなど無関係な一致は拾わないようにするため、
  // LCSではなく前方一致の長さで判定する。
  const na = normalizeStr(a), nb = normalizeStr(b);
  if (!na || !nb) return 0;
  const shorterLen = Math.min(na.length, nb.length);
  let matchLen = 0;
  while (matchLen < shorterLen && na[matchLen] === nb[matchLen]) matchLen++;
  return matchLen / shorterLen;
}
// 上代（税抜）を統合候補の絶対条件として使うためのヘルパー。片方でも上代が
// 不明（空・数値化できない）な場合はゲートを適用せず、従来通り品名/品番類似度のみで判定する
// （上代列が無い過去データや旧仕様のマッピングを持つ既登録品番との突き合わせを壊さないため）。
function parsePrice(v) {
  if (v === undefined || v === null || v === "") return null;
  const n = Number(String(v).replace(/[,¥\s]/g, ""));
  return Number.isFinite(n) ? n : null;
}
function priceGateOk(a, b) {
  const pa = parsePrice(a), pb = parsePrice(b);
  if (pa === null || pb === null) return true;
  return pa === pb;
}
// 「既に登録済みのZOZO品番」との類似候補を、足切りせず登録済み全件から近い順に並べるための
// 複合スコア。サブアイテム一致・上代一致（分かっている場合）・品番近さを加点、上代が分かって
// いて不一致の場合のみ減点するが、除外はしない（誤登録の訂正など、本来違うはずの候補を
// あえて選び直したいケースに対応するため、常に全件を選択肢に残す）。
function historicalMatchScore(unit, rep, banbanThreshold) {
  let score = nameSimilarity(unit.name, rep.name);
  if (rep.subitem === unit.subitem) score += 1;
  const pu = parsePrice(unit.price), pr = parsePrice(rep.price);
  if (pu !== null && pr !== null) score += pu === pr ? 0.5 : -0.5;
  const banbanClose = rep.originalBanbans.some((b) => banbanNear(unit.banban, b, banbanThreshold));
  if (banbanClose) score += 0.3;
  return score;
}
function skuKey(row) { return `${row.banban}-${row.color}-${row.size}`; }

/* ---- ZOZO品番 発番: PREFIX + YY + MON + AA0001 形式（例: ZZ-26JULAA0001）、月替わりでリセット ---- */
const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function alphaToIndex(alpha) { return (alpha.charCodeAt(0) - 65) * 26 + (alpha.charCodeAt(1) - 65); }
function indexToAlpha(index) {
  const c0 = Math.floor(index / 26), c1 = index % 26;
  return String.fromCharCode(65 + c0) + String.fromCharCode(65 + c1);
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function currentZozoScopePrefix(prefix) {
  const now = new Date();
  const yy = String(now.getFullYear() % 100).padStart(2, "0");
  return `${prefix}${yy}${MONTH_ABBR[now.getMonth()]}`;
}
function suggestZozoBanban(prefix) {
  const scopePrefix = currentZozoScopePrefix(prefix);
  const pattern = new RegExp(`^${escapeRegex(scopePrefix)}([A-Z]{2})(\\d{4})$`);
  const allBanbans = [...getMapping().map((m) => m.zozo_banban), ...getHistory().map((h) => h.zozo_banban)];
  let maxRank = -1;
  for (const b of allBanbans) {
    const m = pattern.exec(b || "");
    if (!m) continue;
    const rank = alphaToIndex(m[1]) * 9999 + (parseInt(m[2], 10) - 1);
    if (rank > maxRank) maxRank = rank;
  }
  const nextRank = maxRank + 1;
  const serial = `${indexToAlpha(Math.floor(nextRank / 9999))}${String((nextRank % 9999) + 1).padStart(4, "0")}`;
  return `${scopePrefix}${serial}`;
}
// manualPairs: [[banbanA, banbanB], ...] — a forced union between the two representative
// banban units, regardless of thresholds. Unioning one representative from each side is
// enough to merge two whole (already mutually-unioned) components together.
// excludedBanbans: 品番の集合。含まれる品番は自動しきい値マッチングの対象外になる
// （＝どんなに品番・品名が近くても自動グループには入らない）。手動追加（manualPairs）で
// 明示的に指定されれば、除外扱いでもそのグループには入れられる。
function buildCandidateGroups(rows, banbanThreshold, nameThreshold, manualPairs = [], excludedBanbans = new Set()) {
  const n = rows.length;
  const parent = Array.from({ length: n }, (_, i) => i);
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
  const pairScores = {};
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = rows[i], b = rows[j];
      if (excludedBanbans.has(a.banban) || excludedBanbans.has(b.banban)) continue;
      if (a.subitem !== b.subitem) continue;
      // 上代（税抜）が分かっていて一致しない場合は絶対に候補にしない（絶対条件）。
      // 一致している/不明な場合は、品名類似度・品番近さのどちらかを満たせば候補にする
      // （以前は品番近さ「かつ」品名類似度の両方が必須で見逃しが多かったため、いずれかでよい形に緩和）。
      if (!priceGateOk(a.price, b.price)) continue;
      const score = nameSimilarity(a.name, b.name);
      const banbanClose = banbanNear(a.banban, b.banban, banbanThreshold);
      if (score >= nameThreshold || banbanClose) { union(i, j); pairScores[`${i},${j}`] = score; }
    }
  }
  for (const [bA, bB] of manualPairs) {
    const ia = rows.findIndex((r) => r.banban === bA);
    const ib = rows.findIndex((r) => r.banban === bB);
    if (ia >= 0 && ib >= 0) union(ia, ib);
  }
  const groupsWithManual = new Set();
  for (const [bA] of manualPairs) {
    const ia = rows.findIndex((r) => r.banban === bA);
    if (ia >= 0) groupsWithManual.add(find(ia));
  }
  const groups = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(i);
  }
  const candidateGroups = [];
  for (const [root, members] of groups.entries()) {
    if (members.length < 2) continue;
    let maxScore = 0;
    for (let a = 0; a < members.length; a++) {
      for (let b = a + 1; b < members.length; b++) {
        const key = `${Math.min(members[a], members[b])},${Math.max(members[a], members[b])}`;
        if (pairScores[key] !== undefined) maxScore = Math.max(maxScore, pairScores[key]);
      }
    }
    candidateGroups.push({ members: members.map((idx) => rows[idx]), score: maxScore, manual: groupsWithManual.has(root) });
  }
  return candidateGroups;
}

// mappingをzozo_banban単位でまとめ、既存ZOZO品番グループの代表情報を作る。
// isMerged = 実際に2件以上のSKUが統合されたグループ（単独確定のみのものは含まない）。
function buildZozoGroupReps(mapping) {
  const byBanban = new Map();
  for (const m of mapping) {
    if (!byBanban.has(m.zozo_banban)) byBanban.set(m.zozo_banban, []);
    byBanban.get(m.zozo_banban).push(m);
  }
  return [...byBanban.entries()].map(([zozoBanban, entries]) => ({
    zozoBanban, name: entries[0].name, subitem: entries[0].subitem, price: entries[0].price,
    originalBanbans: [...new Set(entries.map((e) => e.sqg_banban))],
    skuKeys: entries.map((e) => e.sku_key),
    entries,
    isMerged: entries.some((e) => e.merged_with && e.merged_with.length > 0),
  }));
}
// state.manualJoinCandidates/manualJoinSelectionsはインデックスで紐づいているため、
// 配列途中の要素をfilterで取り除くと後続の要素のインデックスがずれて選択状態が
// 食い違ってしまう。取り除いた後は必ずこのヘルパーで選択状態を付け直す。
function removeManualJoinCandidate(ci) {
  const oldCandidates = state.manualJoinCandidates || [];
  const oldSelections = state.manualJoinSelections || {};
  const newCandidates = oldCandidates.filter((_, i) => i !== ci);
  const newSelections = {};
  let newIdx = 0;
  oldCandidates.forEach((_, oldIdx) => {
    if (oldIdx === ci) return;
    newSelections[newIdx] = oldSelections[oldIdx];
    newIdx++;
  });
  state.manualJoinCandidates = newCandidates;
  state.manualJoinSelections = newSelections;
}

/* ================= analyze / confirm ================= */
function analyze(inputRows, manualUnions = [], excludedBanbans = []) {
  const settings = getSettings();
  const mapping = getMapping();
  const mappingByKey = new Map(mapping.map((m) => [m.sku_key, m]));
  const registeredSet = new Set(getRegisteredBanbans());

  // SKU count per 元品番 (informational — decides the fallback label when no match is found)
  const combosByBanban = new Map();
  for (const r of inputRows) {
    if (!combosByBanban.has(r.banban)) combosByBanban.set(r.banban, new Set());
    combosByBanban.get(r.banban).add(`${r.color}__${r.size}`);
  }

  const withKeys = inputRows.map((r) => ({ ...r, skuKey: skuKey(r) }));
  const alreadyMappedRows = [], alreadyRegisteredRows = [], pool = [];

  for (const r of withKeys) {
    if (registeredSet.has(r.banban)) {
      alreadyRegisteredRows.push({ ...r, status: "登録済み(ZOZOマスタ)", zozoBanban: r.banban, originalName: r.name, originalColor: r.color });
      continue;
    }
    const existing = mappingByKey.get(r.skuKey);
    if (existing) {
      const status = existing.merged_with && existing.merged_with.length > 0 ? "確定済(統合)" : "確定済(単独)";
      alreadyMappedRows.push({
        ...r, status, zozoBanban: existing.zozo_banban,
        name: existing.name || r.name, originalName: existing.original_name || r.name,
        originalColor: r.color, color: existing.zozo_color || existing.color || r.color,
        zozoSize: existing.zozo_size || r.size,
      });
    } else {
      pool.push(r);
    }
  }

  // Group not-yet-mapped rows by 元品番 into matching "units" — apparel items that already
  // span multiple sizes under one 品番 (色違いでサイズ違いのパターン) are still eligible for
  // name-similarity matching against other 品番, not just strict 1品番1SKU rows.
  const rowsByBanban = new Map();
  for (const r of pool) {
    if (!rowsByBanban.has(r.banban)) rowsByBanban.set(r.banban, []);
    rowsByBanban.get(r.banban).push(r);
  }
  const units = [...rowsByBanban.values()].map((rows) => ({
    banban: rows[0].banban, subitem: rows[0].subitem, name: rows[0].name, price: rows[0].price, rows,
  }));

  const unitGroups = buildCandidateGroups(units, settings.banban_threshold, settings.name_threshold, manualUnions, new Set(excludedBanbans));
  const groupedBanbanSet = new Set();
  unitGroups.forEach((g) => g.members.forEach((u) => groupedBanbanSet.add(u.banban)));

  const candidateGroups = unitGroups.map((g) => ({
    score: g.score,
    manual: g.manual,
    members: g.members.flatMap((u) => u.rows),
  }));

  const pendingRows = pool.map((r) => {
    if (groupedBanbanSet.has(r.banban)) return { ...r, status: "統合候補あり(未確定)", zozoBanban: r.banban, originalName: r.name, originalColor: r.color };
    const isSingleSku = combosByBanban.get(r.banban).size === 1;
    return { ...r, status: isSingleSku ? "単独品番(統合対象なし)" : "対象外(複数SKU)", zozoBanban: r.banban, originalName: r.name, originalColor: r.color };
  });

  // 既に登録済み（過去の別バッチで確定した）ZOZO品番との類似候補。
  // 新色追加などで単一SKUとして埋もれてしまい既存品番に引っかからないケースを無くすため、
  // しきい値で足切りせず、未確定の元品番ごとに登録済み全件を近い順にランキングして常に候補を出す
  // （全件が選択肢に残るので、自動候補が外れていても手動で選び直せる＝エラー対応できる）。
  const historicalReps = buildZozoGroupReps(mapping);

  const historicalSuggestions = historicalReps.length === 0 ? [] : units.map((unit) => {
    const ranked = historicalReps
      .map((rep) => ({ rep, score: historicalMatchScore(unit, rep, settings.banban_threshold) }))
      .sort((a, b) => b.score - a.score);
    return { unit, ranked };
  });

  const allRows = [...alreadyRegisteredRows, ...alreadyMappedRows, ...pendingRows];
  const summary = {
    total: inputRows.length,
    alreadyRegisteredCount: alreadyRegisteredRows.length,
    singleSkuCount: alreadyMappedRows.length + pendingRows.length,
    candidateGroupCount: candidateGroups.length,
    mappingCount: mapping.length,
  };
  return { rows: allRows, candidateGroups, summary, allUnits: units, historicalSuggestions };
}

function nfkcTrim(s) { return (s || "").normalize("NFKC").trim(); }
function commonNamePrefix(names) {
  const list = names.map(nfkcTrim).filter(Boolean);
  if (list.length === 0) return "";
  let prefix = list[0];
  for (let i = 1; i < list.length; i++) {
    const s = list[i];
    let j = 0;
    while (j < prefix.length && j < s.length && prefix[j] === s[j]) j++;
    prefix = prefix.slice(0, j);
  }
  return prefix || list[0];
}

// SKUキー衝突（同一カラー+サイズ）検出・解消のためのヘルパー。
// 元システムでは色違いの無い単発品（ぬいぐるみの柄違いなど）はカラーコードが
// 固定値（例: 999）で入っていることが多く、統合後に複数商品が同じSKUになってしまう
// ケースがあるため、衝突時だけ自社カラーマスタから別コードを選べるようにする。
// サイズコードは自社サイズマスタのキー（2桁ゼロ埋め）に揃えて扱う（"1"と"01"を同じ扱いにするため）。
function normSize(s) { return String(s ?? "").padStart(2, "0"); }
function findDuplicateColorSizeKeys(items) {
  const counts = new Map();
  for (const it of items) {
    const key = `${it.color}__${normSize(it.size)}`;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const dup = new Set();
  for (const [key, count] of counts.entries()) if (count > 1) dup.add(key);
  return dup;
}
// カラー名から大まかな系統色を推定する（正確な色の再現が目的ではなく、選択時に
// 視覚的な目印になれば十分という前提）。「1番色」「その他」「X」等の判別用の
// プレースホルダーはヒットしないので、その場合は無地（▫）扱いにする。
// <option>はテキストの色しか変えられず文字ごと読みにくくなるため、絵文字の色付き
// 四角（それ自体が固定の色で描画される）を使い、文字色には一切手を触れない。
const COLOR_SWATCH_KEYWORDS = [
  [/白|ﾎﾜｲﾄ|ホワイト|アイボリー|ｱｲﾎﾞﾘｰ|ナチュラル|ﾅﾁｭﾗﾙ|生成|キナリ|オフホワイト|クリーム/, "⬜"],
  [/黒|ﾌﾞﾗｯｸ|ブラック|クロ|墨/, "⬛"],
  [/銀|ｼﾙﾊﾞｰ|シルバー|グレー|ｸﾞﾚｰ|アッシュ|杢/, "⬜"],
  [/金|ｺﾞｰﾙﾄﾞ|ゴールド/, "🟨"],
  [/赤|ﾚｯﾄﾞ|レッド|ワイン|ボルドー|エンジ|バーガンディ|桃|ﾋﾟﾝｸ|ピンク|ローズ|サーモン|フューシャ/, "🟥"],
  [/橙|ｵﾚﾝｼﾞ|オレンジ|テラコッタ|コーラル|アプリコット/, "🟧"],
  [/黄|ｲｴﾛｰ|イエロー|マスタード|レモン|ターメリック/, "🟨"],
  [/緑|ｸﾞﾘｰﾝ|グリーン|カーキ|オリーブ|ミント|エメラルド|ライム/, "🟩"],
  [/青|ﾌﾞﾙｰ|ブルー|ネイビー|ﾈｲﾋﾞｰ|サックス|インディゴ|ﾃﾞﾆﾑ|デニム|スカイ|アクア|ターコイズ/, "🟦"],
  [/紫|ﾊﾟｰﾌﾟﾙ|パープル|バイオレット|ラベンダー/, "🟪"],
  [/茶|ﾌﾞﾗｳﾝ|ブラウン|ベージュ|ｷｬﾒﾙ|キャメル|モカ|チョコ|ウッド|タン/, "🟫"],
];
function colorSwatchEmoji(ownName, zozoName) {
  const text = `${ownName || ""} ${zozoName || ""}`;
  for (const [re, emoji] of COLOR_SWATCH_KEYWORDS) {
    if (re.test(text)) return emoji;
  }
  return null;
}
function colorOptionsHtml(colorMap, selectedCode) {
  const codes = Object.keys(colorMap).sort();
  return codes.map((code) => {
    const info = colorMap[code];
    const label = info && info.name
      ? `${code} ${info.ownName || ""} (${info.id}:${info.name})`
      : code;
    const glyph = (info && colorSwatchEmoji(info.ownName, info.name)) || "▫️";
    return `<option value="${escapeHtml(code)}" ${code === selectedCode ? "selected" : ""}>${glyph} ${escapeHtml(label)}</option>`;
  }).join("");
}
// SKU用サイズ（ZOZOサイズ）の選択肢。サイズマスタに無い元サイズがそのまま選ばれていても
// 初期値として失われないよう、マスタに無い場合は先頭に追加する。
function sizeOptionsHtml(sizeMap, selectedCode) {
  const sel = normSize(selectedCode);
  const codes = Object.keys(sizeMap).sort();
  const opts = codes.map((code) => {
    const info = sizeMap[code];
    const label = info && info.name ? `${code} ${info.name} (${info.id})` : code;
    return `<option value="${escapeHtml(code)}" ${code === sel ? "selected" : ""}>${escapeHtml(label)}</option>`;
  });
  if (!sizeMap[sel]) opts.unshift(`<option value="${escapeHtml(sel)}" selected>${escapeHtml(sel)}（マスタ未登録）</option>`);
  return opts.join("");
}

function confirmMerge(members, zozoBanban, unifiedName) {
  const mapping = getMapping();
  const history = getHistory();
  const now = new Date().toISOString();
  const allKeys = members.map((m) => m.skuKey);
  if (!unifiedName) unifiedName = commonNamePrefix(members.map((m) => m.name));
  for (const m of members) {
    const entry = {
      sku_key: m.skuKey, zozo_banban: zozoBanban, sqg_banban: m.banban, subitem: m.subitem,
      color: m.color, zozo_color: m.effectiveColor || m.color, size: m.size, zozo_size: m.effectiveSize || m.size,
      name: unifiedName, original_name: m.name,
      price: m.price, merged_with: allKeys.filter((k) => k !== m.skuKey), confirmed_at: now,
    };
    const idx = mapping.findIndex((x) => x.sku_key === m.skuKey);
    if (idx >= 0) mapping[idx] = entry; else mapping.push(entry);
  }
  const nextId = history.reduce((max, h) => Math.max(max, h.id), 0) + 1;
  history.push({
    id: nextId, timestamp: now, zozo_banban: zozoBanban, sku_keys: allKeys,
    original_banbans: members.map((m) => m.banban), names: members.map((m) => m.name),
  });
  setMapping(mapping);
  setHistory(history);
}

function confirmStandalone(members) {
  const mapping = getMapping();
  const history = getHistory();
  const now = new Date().toISOString();
  for (const m of members) {
    const entry = {
      sku_key: m.skuKey, zozo_banban: m.banban, sqg_banban: m.banban, subitem: m.subitem,
      color: m.color, zozo_color: m.color, size: m.size, zozo_size: m.size, name: m.name, original_name: m.name,
      price: m.price, merged_with: [], confirmed_at: now,
    };
    const idx = mapping.findIndex((x) => x.sku_key === m.skuKey);
    if (idx >= 0) mapping[idx] = entry; else mapping.push(entry);
    const nextId = history.reduce((max, h) => Math.max(max, h.id), 0) + 1;
    history.push({
      id: nextId, timestamp: now, zozo_banban: m.banban, sku_keys: [m.skuKey],
      original_banbans: [m.banban], names: [m.name],
    });
  }
  setMapping(mapping);
  setHistory(history);
}

// members: the rows (all SKUs) of a単一元品番 unit that the user confirms is the same
// physical product as an already-registered ZOZO品番 group (見つかった過去の統合先).
function confirmJoinExisting(members, zozoBanban, unifiedName) {
  const mapping = getMapping();
  const history = getHistory();
  const now = new Date().toISOString();
  const existingMembers = mapping.filter((m) => m.zozo_banban === zozoBanban);
  if (!unifiedName) {
    const existingName = existingMembers.length > 0 ? existingMembers[0].name : members[0].name;
    unifiedName = commonNamePrefix([existingName, ...members.map((m) => m.name)]);
  }
  const newKeys = members.map((m) => m.skuKey);
  const allKeys = [...existingMembers.map((m) => m.sku_key), ...newKeys];

  // original_name is immutable once set — a join only ever updates the shared display
  // name/merged_with, never the true original per-SKU name recorded at first confirmation.
  for (const m of existingMembers) {
    const idx = mapping.findIndex((x) => x.sku_key === m.sku_key);
    mapping[idx] = { ...mapping[idx], name: unifiedName, merged_with: allKeys.filter((k) => k !== m.sku_key) };
  }
  for (const m of members) {
    const entry = {
      sku_key: m.skuKey, zozo_banban: zozoBanban, sqg_banban: m.banban, subitem: m.subitem,
      color: m.color, zozo_color: m.effectiveColor || m.color, size: m.size, zozo_size: m.effectiveSize || m.size,
      name: unifiedName, original_name: m.name,
      price: m.price, merged_with: allKeys.filter((k) => k !== m.skuKey), confirmed_at: now,
    };
    const idx = mapping.findIndex((x) => x.sku_key === m.skuKey);
    if (idx >= 0) mapping[idx] = entry; else mapping.push(entry);
  }

  const nextId = history.reduce((max, h) => Math.max(max, h.id), 0) + 1;
  history.push({
    id: nextId, timestamp: now, zozo_banban: zozoBanban, sku_keys: allKeys,
    // sku_keys/namesとインデックスが1:1で対応する必要があるため、original_banbansは
    // Setで重複除去しない（除去すると要素数がずれ、復元時に別のSKUの元品番を誤って
    // 参照してしまう）。
    original_banbans: [...existingMembers.map((m) => m.sqg_banban), ...members.map((m) => m.banban)],
    names: [...existingMembers.map((m) => m.original_name || m.name), ...members.map((m) => m.name)],
  });

  setMapping(mapping);
  setHistory(history);
}

/* ================= misc helpers ================= */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function statusClass(status) {
  return {
    "対象外(複数SKU)": "s-multi",
    "単独品番(統合対象なし)": "s-standalone-pending",
    "統合候補あり(未確定)": "s-candidate",
    "確定済(統合)": "s-merged",
    "確定済(単独)": "s-standalone-confirmed",
  }[status] || "";
}
function copyToClipboard(text) {
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    alert(ok ? "コピーしました。" : "コピーに失敗しました。手動で選択してコピーしてください。");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert("コピーしました。")).catch(fallback);
  } else {
    fallback();
  }
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function tcLoadMaster() {
  const c = localStorage.getItem("colorMaster");
  const s = localStorage.getItem("sizeMaster");
  let color = c ? JSON.parse(c) : null;
  let size = s ? JSON.parse(s) : null;
  if (color && color.length > 0 && color[0].length < 4) { color = null; localStorage.removeItem("colorMaster"); }
  if (size && size.length > 0 && size[0].length < 3) { size = null; localStorage.removeItem("sizeMaster"); }
  return {
    color: color ?? JSON.parse(JSON.stringify(TC_DEFAULT_COLOR)),
    size: size ?? JSON.parse(JSON.stringify(TC_DEFAULT_SIZE)),
  };
}
function tcSaveMaster(color, size) {
  localStorage.setItem("colorMaster", JSON.stringify(color));
  localStorage.setItem("sizeMaster", JSON.stringify(size));
  markCloudDirty();
}
function tcGetMasterMap() {
  const m = tcLoadMaster();
  const colorMap = {}, sizeMap = {};
  m.color.forEach((r) => {
    const key = String(r[0]).padStart(3, "0");
    if (r.length >= 4) colorMap[key] = { ownName: String(r[1]), id: String(r[2]), name: String(r[3]) };
    else if (r.length === 3) colorMap[key] = { ownName: "", id: String(r[1]), name: String(r[2]) };
    else colorMap[key] = { ownName: "", id: "", name: String(r[1] ?? "") };
  });
  m.size.forEach((r) => {
    const key = String(r[0]).padStart(2, "0");
    sizeMap[key] = r.length >= 3 ? { name: String(r[1]), id: String(r[2]) } : { name: String(r[1]), id: "" };
  });
  return { colorMap, sizeMap };
}

function toZenkakuKana(str) {
  const s = str || "";
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    const next = s[i + 1];
    if (next === "ﾞ" && HANKAKU_KANA_DAKUTEN[c]) { out += HANKAKU_KANA_DAKUTEN[c]; i++; continue; }

    out += HANKAKU_KANA_BASE[c] || c;
  }
  return out.normalize("NFC");
}

// 全角カナ→半角カナ（濁点・半濁点付きの文字は基底文字＋半角濁点/半濁点の2文字に分解する）。
// カナ以外（漢字・記号など）は半角化できないのでそのまま残す。
const ZENKAKU_KANA_TO_HANKAKU = {
  "ア": "ｱ", "イ": "ｲ", "ウ": "ｳ", "エ": "ｴ", "オ": "ｵ",
  "カ": "ｶ", "キ": "ｷ", "ク": "ｸ", "ケ": "ｹ", "コ": "ｺ",
  "サ": "ｻ", "シ": "ｼ", "ス": "ｽ", "セ": "ｾ", "ソ": "ｿ",
  "タ": "ﾀ", "チ": "ﾁ", "ツ": "ﾂ", "テ": "ﾃ", "ト": "ﾄ",
  "ナ": "ﾅ", "ニ": "ﾆ", "ヌ": "ﾇ", "ネ": "ﾈ", "ノ": "ﾉ",
  "ハ": "ﾊ", "ヒ": "ﾋ", "フ": "ﾌ", "ヘ": "ﾍ", "ホ": "ﾎ",
  "マ": "ﾏ", "ミ": "ﾐ", "ム": "ﾑ", "メ": "ﾒ", "モ": "ﾓ",
  "ヤ": "ﾔ", "ユ": "ﾕ", "ヨ": "ﾖ",
  "ラ": "ﾗ", "リ": "ﾘ", "ル": "ﾙ", "レ": "ﾚ", "ロ": "ﾛ",
  "ワ": "ﾜ", "ヲ": "ｦ", "ン": "ﾝ",
  "ァ": "ｧ", "ィ": "ｨ", "ゥ": "ｩ", "ェ": "ｪ", "ォ": "ｫ",
  "ャ": "ｬ", "ュ": "ｭ", "ョ": "ｮ", "ッ": "ｯ",
  "ー": "ｰ", "。": "｡", "、": "､", "「": "｢", "」": "｣", "・": "･",
  "ガ": "ｶﾞ", "ギ": "ｷﾞ", "グ": "ｸﾞ", "ゲ": "ｹﾞ", "ゴ": "ｺﾞ",
  "ザ": "ｻﾞ", "ジ": "ｼﾞ", "ズ": "ｽﾞ", "ゼ": "ｾﾞ", "ゾ": "ｿﾞ",
  "ダ": "ﾀﾞ", "ヂ": "ﾁﾞ", "ヅ": "ﾂﾞ", "デ": "ﾃﾞ", "ド": "ﾄﾞ",
  "バ": "ﾊﾞ", "ビ": "ﾋﾞ", "ブ": "ﾌﾞ", "ベ": "ﾍﾞ", "ボ": "ﾎﾞ",
  "ヴ": "ｳﾞ",
  "パ": "ﾊﾟ", "ピ": "ﾋﾟ", "プ": "ﾌﾟ", "ペ": "ﾍﾟ", "ポ": "ﾎﾟ",
};
function toHankakuKana(str) {
  return [...(str || "")].map((ch) => ZENKAKU_KANA_TO_HANKAKU[ch] || ch).join("");
}
// Shift-JIS換算の簡易バイト数（半角＝1バイト、それ以外＝2バイト）で切り詰める。
// ZOZOのカラー名は半角カナ17バイト以内という制約があるため。
function sjisByteLength(ch) {
  const code = ch.codePointAt(0);
  if (code <= 0x7e) return 1;
  if (code >= 0xff61 && code <= 0xff9f) return 1;
  return 2;
}
function truncateToBytes(str, maxBytes) {
  let bytes = 0, out = "";
  for (const ch of str) {
    const len = sjisByteLength(ch);
    if (bytes + len > maxBytes) break;
    bytes += len;
    out += ch;
  }
  return out;
}
function toHankakuColorName(str, maxBytes = 17) {
  return truncateToBytes(toHankakuKana(str), maxBytes);
}

// タグ発行CSV（システム出力・タブ区切り）列順:
// No. / 呼び出しデータ名 / 検索用呼び出し名 / メーカー / 品番 / JAN / 品名 / 価格 / カラー名(削除) / Cコード / Sコード
// 元品番+Cコード+Sコード（＝このアプリのSKUキーと同じ組み立て方）で mapping を引き、
// 統合済みなら 品番・品名 を ZOZO品番・統一品名に差し替えてから SKUコードを組み立てる。
function tcConvert(rawText) {
  const mapping = getMapping();
  const mappingByKey = new Map(mapping.map((m) => [m.sku_key, m]));
  // 元システムのカラー・サイズコードは「1」と「001」のように桁数が揃っていないことがあるため、
  // 厳密に一致しなかった場合は先頭のゼロを無視した形でも照合する。
  const normCode = (v) => { const s = String(v ?? "").trim(); return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s; };
  const normKey = (b, c, s) => `${String(b ?? "").trim()}-${normCode(c)}-${normCode(s)}`;
  const mappingByNormKey = new Map();
  const mappingByBanban = new Map();
  for (const m of mapping) {
    const b = m.sqg_banban || "";
    mappingByNormKey.set(normKey(b, m.color, m.size), m);
    if (!mappingByBanban.has(b)) mappingByBanban.set(b, []);
    mappingByBanban.get(b).push(m);
  }
  const { colorMap, sizeMap } = tcGetMasterMap();
  const lines = rawText.split(/\r?\n/).filter((l) => l.trim() !== "");
  let rowNum = 0, errCount = 0;
  const rows = [], invoiceRows = [], statuses = [];

  lines.forEach((line) => {
    const cols = line.split("\t");
    if (cols.length < 11) { errCount++; return; }
    const cRaw = cols[9].trim();
    const sRaw = (cols.length > 11 && /^\d+$/.test(cols[11].trim())) ? cols[11].trim()
      : (/^\d+$/.test(cols[10].trim()) ? cols[10].trim() : (cols[11] || "").trim());
    const cCode = String(cRaw).padStart(3, "0");
    const sCode = String(sRaw).padStart(2, "0");
    const origBanban = cols[4].trim();
    let hinban = origBanban;
    let hinmei = cols[6].trim();

    const lookupKey = `${hinban}-${cCode}-${sCode}`;
    const mapped = mappingByKey.get(lookupKey) || mappingByNormKey.get(normKey(origBanban, cRaw, sRaw));
    if (mapped) {
      statuses.push({ ok: true, text: "変換済み" });
    } else if (mappingByBanban.has(origBanban)) {
      const regs = mappingByBanban.get(origBanban).map((m) => `${m.color}/${m.size}`).join("、");
      statuses.push({ ok: false, text: `元品番は登録済みだが、カラー/サイズが一致しない（タグ: ${cRaw}/${sRaw}、登録: ${regs}）` });
    } else {
      statuses.push({ ok: false, text: "この元品番は未登録（品番発行で確定されていない／このPCにデータが無い）" });
    }
    // マッピングで「SKU用カラー」が別のコードに割り当てられている場合（統合時に色コードが
    // 衝突していたケース）は、そちらを実際のSKU組み立てに使う。元品番+元カラーでの検索キー
    // 自体は変えない（過去データとの再照合を壊さないため）。
    // サイズも同様に、マッピングで「SKU用サイズ」が指定されていればそちらを使う。
    let effectiveCCode = cCode;
    let effectiveSCode = sCode;
    if (mapped) {
      hinban = mapped.zozo_banban;
      hinmei = mapped.name;
      if (mapped.zozo_color) effectiveCCode = mapped.zozo_color;
      if (mapped.zozo_size) effectiveSCode = normSize(mapped.zozo_size);
    }

    // C/S・SKUコードは自社コードではなく、カラー・サイズマスタで対応する
    // ZOZOの実際のカラーID／サイズIDに変換した値を使う。
    const cEntry = colorMap[effectiveCCode];
    const sEntry = sizeMap[effectiveSCode];
    const zozoColorId = (cEntry && cEntry.id) || effectiveCCode;
    const zozoSizeId = (sEntry && sEntry.id) || effectiveSCode;
    const colorName = toHankakuColorName(cEntry ? cEntry.name : `(C:${effectiveCCode})`);
    const sizeName = sEntry ? sEntry.name : `(S:${effectiveSCode})`;
    // 変換履歴からSKUコードを直接上書きしている場合は、それを最優先で使う
    // （ZOZO側に誤った内容で既に登録されてしまったSKUを、こちら側の例外として合わせるため）。
    const sku = (mapped && mapped.sku_code_override) ? mapped.sku_code_override : hinban + zozoColorId + zozoSizeId;
    rowNum++;
    rows.push([cols[0].trim(), cols[1].trim(), cols[2].trim(), cols[3].trim(), hinban, cols[5].trim(), zozoColorId, zozoSizeId, sku, colorName, sizeName]);
    const origSku = origBanban + cCode + sCode;
    invoiceRows.push({
      hinban, hinmei, price: parseInt(cols[7].trim()) || 0, jan: cols[5].trim(), colorName, sizeName, sku,
      origBanban, origCCode: cCode, origSCode: sCode, effectiveCCode, origSku,
    });
  });

  return { rows, invoiceRows, rowNum, errCount, statuses, mappingCount: mapping.length };
}

// ===== 納品書番号管理 =====
function tcReadSeq() { try { return parseInt(localStorage.getItem("cny_invoice_seq") || "0"); } catch (e) { return 0; } }
function tcWriteSeq(n) { try { localStorage.setItem("cny_invoice_seq", n); } catch (e) {} }
function tcGetNextInvoiceNo() { return `CNY-AA${String(tcReadSeq() + 1).padStart(7, "0")}`; }
function tcConsumeInvoiceNo(no) {
  const m = String(no).match(/(\d+)\s*$/);
  if (m) { const n = parseInt(m[1]); if (n > tcReadSeq()) tcWriteSeq(n); }
}

// ===== 納品書発行（ExcelJS） =====
async function tcGenerateInvoice(invoiceRows, rawInvoiceNo) {
  if (!invoiceRows || !invoiceRows.length) { alert("先に変換を実行してください。"); return; }

  const invoiceNo = /^\d+$/.test(rawInvoiceNo)
    ? `CNY-AA${String(parseInt(rawInvoiceNo)).padStart(7, "0")}`
    : (rawInvoiceNo || tcGetNextInvoiceNo());
  tcConsumeInvoiceNo(invoiceNo);

  const skuMap = {};
  invoiceRows.forEach((r) => {
    if (!skuMap[r.sku]) skuMap[r.sku] = { ...r, qty: 0 };
    skuMap[r.sku].qty += 1;
  });
  const items = Object.values(skuMap);

  const d = new Date();
  const dateStr = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;

  const ROWS_PER_PAGE = 40;
  const totalPages = Math.ceil(items.length / ROWS_PER_PAGE);
  const BLOCK = 50;

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("納品書");
  ws.getColumn(1).width = 3;

  const FN = "Meiryo UI";
  const BLK = { argb: "FF000000" };
  const WHT = { argb: "FFFFFFFF" };
  const THIN = { style: "thin", color: { argb: "FF000000" } };
  const BDR = { top: THIN, bottom: THIN, left: THIN, right: THIN };

  const sc = (addr, val, opt = {}) => {
    const c = ws.getCell(addr);
    c.value = val ?? null;
    c.font = { name: FN, size: opt.sz || 10, bold: !!opt.bold, color: opt.white ? WHT : BLK };
    c.alignment = { horizontal: opt.h || "left", vertical: "middle" };
    if (opt.bdr) c.border = BDR;
    if (opt.blk) c.fill = { type: "pattern", pattern: "solid", fgColor: BLK };
    if (opt.fmt) c.numFmt = opt.fmt;
  };

  const totQty = items.reduce((s, x) => s + x.qty, 0);
  const totAmt = items.reduce((s, x) => s + x.qty * x.price, 0);

  for (let p = 0; p < totalPages; p++) {
    const BASE = p * BLOCK;
    const R = (n) => BASE + n;
    const pageItems = items.slice(p * ROWS_PER_PAGE, (p + 1) * ROWS_PER_PAGE);
    const isLast = p === totalPages - 1;

    ws.getRow(R(1)).height = 30;
    sc(`B${R(1)}`, "納　品　書", { sz: 16, bold: true });
    sc(`I${R(1)}`, `${p + 1}/${totalPages}ページ`, { sz: 10, h: "right" });
    ws.getRow(R(2)).height = 6;
    ws.getRow(R(3)).height = 18;
    sc(`B${R(3)}`, "株式会社ZOZO　ZOZOBASE宛");
    sc(`F${R(3)}`, "会社名：株式会社CHELSEA New York");
    ws.getRow(R(4)).height = 18;
    sc(`F${R(4)}`, `納品書日付：${dateStr}`);
    ws.getRow(R(5)).height = 22;
    sc(`B${R(5)}`, "SHOP", { bold: true, blk: true, white: true, h: "center", bdr: true });
    sc(`C${R(5)}`, "CHELSEA New York", { bdr: true });
    sc(`F${R(5)}`, `ブランド納品書番号：${invoiceNo}`);
    ws.getRow(R(6)).height = 10;
    ws.getRow(R(7)).height = 22;
    ["品番", "商品名", "カラー", "サイズ", "CS品番（SKU品番）", "数量", "上代（税抜）", "上代合計"]
      .forEach((lbl, i) => sc(`${String.fromCharCode(66 + i)}${R(7)}`, lbl, { bold: true, blk: true, white: true, h: "center", bdr: true }));

    const DS = R(8);
    const DL = R(7 + ROWS_PER_PAGE);

    for (let i = 0; i < ROWS_PER_PAGE; i++) {
      const row = DS + i;
      const itm = pageItems[i] || null;
      ws.getRow(row).height = 17;
      sc(`B${row}`, itm?.hinban ?? null, { bdr: true });
      sc(`C${row}`, itm?.hinmei ?? null, { bdr: true });
      sc(`D${row}`, itm?.colorName ?? null, { bdr: true, h: "center" });
      sc(`E${row}`, itm?.sizeName ?? null, { bdr: true, h: "center" });
      sc(`F${row}`, itm?.sku ?? null, { bdr: true, h: "center" });

      const gC = ws.getCell(`G${row}`);
      gC.value = itm ? itm.qty : null;
      gC.font = { name: FN, size: 10 };
      gC.alignment = { horizontal: "center", vertical: "middle" };
      gC.border = BDR;

      const hC = ws.getCell(`H${row}`);
      hC.value = itm ? itm.price : null;
      hC.font = { name: FN, size: 10 };
      hC.alignment = { horizontal: "right", vertical: "middle" };
      hC.border = BDR;
      if (itm) hC.numFmt = "¥#,##0";

      const iC = ws.getCell(`I${row}`);
      iC.value = itm ? { formula: `G${row}*H${row}`, result: itm.qty * itm.price } : null;
      iC.font = { name: FN, size: 10 };
      iC.alignment = { horizontal: "right", vertical: "middle" };
      iC.border = BDR;
      if (itm) iC.numFmt = "¥#,##0";
    }

    const TR = R(7 + ROWS_PER_PAGE + 1);
    ws.getRow(TR).height = 22;
    const pageQty = pageItems.reduce((s, x) => s + x.qty, 0);
    const pageAmt = pageItems.reduce((s, x) => s + x.qty * x.price, 0);
    const qtyLabel = isLast ? "総数" : `${p + 1}ページ小計`;
    const amtLabel = isLast ? "合計金額" : `${p + 1}ページ合計`;
    sc(`F${TR}`, qtyLabel, { bold: true, blk: true, white: true, h: "right", bdr: true });

    const gT = ws.getCell(`G${TR}`);
    gT.value = isLast ? { formula: `SUM(G${DS}:G${DL})`, result: pageQty } : pageQty;
    gT.font = { name: FN, size: 10, bold: true, color: WHT };
    gT.alignment = { horizontal: "center", vertical: "middle" };
    gT.fill = { type: "pattern", pattern: "solid", fgColor: BLK };
    gT.border = BDR;

    sc(`H${TR}`, amtLabel, { bold: true, blk: true, white: true, h: "right", bdr: true });
    const iT = ws.getCell(`I${TR}`);
    iT.value = isLast ? { formula: `SUM(I${DS}:I${DL})`, result: pageAmt } : pageAmt;
    iT.font = { name: FN, size: 10, bold: true, color: WHT };
    iT.alignment = { horizontal: "right", vertical: "middle" };
    iT.fill = { type: "pattern", pattern: "solid", fgColor: BLK };
    iT.border = BDR;
    iT.numFmt = "¥#,##0";

    if (isLast && totalPages > 1) {
      const GR = TR + 1;
      ws.getRow(GR).height = 20;
      sc(`F${GR}`, "全体総数", { bold: true, h: "right" });
      const gG = ws.getCell(`G${GR}`);
      gG.value = totQty; gG.font = { name: FN, size: 10, bold: true }; gG.alignment = { horizontal: "center", vertical: "middle" };
      sc(`H${GR}`, "全体合計金額", { bold: true, h: "right" });
      const iG = ws.getCell(`I${GR}`);
      iG.value = totAmt; iG.font = { name: FN, size: 10, bold: true }; iG.alignment = { horizontal: "right", vertical: "middle" };
      iG.numFmt = "¥#,##0";
    }
    if (!isLast) ws.getRow(R(BLOCK)).height = 8;
  }

  ws.pageSetup = {
    paperSize: 9, orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true,
  };
  ws.pageSetup.margins = { left: 0.2, right: 0.2, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 };
  for (let p = 0; p < totalPages - 1; p++) {
    const breakRow = (p + 1) * BLOCK;
    ws.rowBreaks = ws.rowBreaks || [];
    ws.rowBreaks.push({ id: breakRow });
  }

  const colMaxLen = {};
  ws.eachRow((row) => {
    row.eachCell({ includeEmpty: false }, (cell, colNum) => {
      if (colNum === 1) return;
      const v = cell.value;
      if (v === null || v === undefined) return;
      const str = typeof v === "object" && v.formula ? String(v.result ?? "") : String(v);
      const display = [...str].reduce((s, c) => s + (c.charCodeAt(0) > 0x7e ? 2 : 1), 0);
      colMaxLen[colNum] = Math.max(colMaxLen[colNum] || 0, display);
    });
  });
  Object.entries(colMaxLen).forEach(([col, len]) => {
    ws.getColumn(parseInt(col)).width = Math.min(Math.max(len + 2, 8), 60);
  });

  const buf = await wb.xlsx.writeBuffer();
  downloadFile(`納品書_${invoiceNo}.xlsx`, buf, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  tcRefreshInvoiceInput();
  alert(`納品書を発行しました（${invoiceNo}）`);
}
function tcRefreshInvoiceInput() {
  const el = document.getElementById("tc-invoice-no");
  if (el) el.value = tcGetNextInvoiceNo();
}

// ===== ZOZOマスタ登録用データの発行（元SKU→ZOZO置き換え後の対応表） =====
// 出力するたびに履歴（バッチ単位）として記録する。同じバッチは何度でも出力し直せる。
const TC_MASTER_HISTORY_KEY = "zozo_master_output_history";
function tcGetMasterOutputHistory() {
  try { return JSON.parse(localStorage.getItem(TC_MASTER_HISTORY_KEY) || "[]"); } catch (e) { return []; }
}
function tcSetMasterOutputHistory(history) {
  localStorage.setItem(TC_MASTER_HISTORY_KEY, JSON.stringify(history));
  markCloudDirty();
}
// 変換履歴の確定バッチ単位でマスタ登録データを発行する
// （元SKUコード / 元品番 / 元カラー / 元サイズ / ZOZO品番 / ZOZOカラー / ZOZOサイズ / 商品名 の8列）。
async function tcGenerateMasterRegistrationForBatch(batchId) {
  const batch = getConfirmationBatches().find((b) => b.id === batchId);
  if (!batch) { alert("対象データがありません。"); return; }

  // 「ZOZOカラー」「ZOZOサイズ」は自社コードそのものではなく、カラー・サイズマスタで
  // 対応するZOZOの実際のカラーID／サイズIDに変換した値を出力する。
  const { colorMap, sizeMap } = tcGetMasterMap();
  const toZozoColorId = (code) => (colorMap[code] && colorMap[code].id) || code;
  const toZozoSizeId = (code) => (sizeMap[code] && sizeMap[code].id) || code;

  const seen = new Set();
  const rows = [];

  if (batch.allRows && batch.allRows.length > 0) {
    // 新形式：統合・単独確定したものだけでなく、その回に処理した全行
    // （元品番のまま残ったものも含む）をそのまま出力する。
    const liveByKey = new Map(getMapping().map((m) => [m.sku_key, m]));
    for (const r of batch.allRows) {
      const origColor = String(r.originalColor).padStart(3, "0");
      const origSize = String(r.size).padStart(2, "0");
      const effectiveColor = String(r.color).padStart(3, "0");
      // SKU用サイズは、確定後に編集された場合も反映できるよう現在のマッピングを優先する
      const live = liveByKey.get(r.skuKey);
      const effectiveSize = normSize((live && live.zozo_size) || r.zozoSize || r.size);
      const origSku = `${r.banban}${origColor}${origSize}`;
      if (seen.has(origSku)) continue;
      seen.add(origSku);
      rows.push({
        origSku, origBanban: r.banban, origColor, origSize,
        zozoBanban: r.zozoBanban, zozoColor: toZozoColorId(effectiveColor), zozoSize: toZozoSizeId(effectiveSize),
        name: toZenkakuKana(r.name),
      });
    }
  } else {
    // 旧形式（この機能導入前の移行バッチ）：行スナップショットが無いため、
    // マッピング済みのSKUのみを対象にする。
    const entries = getHistoryEntriesForBatch(batchId);
    const mapping = getMapping();
    const mappingByKey = new Map(mapping.map((m) => [m.sku_key, m]));
    const skuKeys = [...new Set(entries.flatMap((h) => h.sku_keys))];
    for (const skuKey of skuKeys) {
      const m = mappingByKey.get(skuKey);
      if (!m) continue;
      const origColor = String(m.color).padStart(3, "0");
      const origSize = String(m.size).padStart(2, "0");
      const effectiveColor = String(m.zozo_color || m.color).padStart(3, "0");
      const effectiveSize = normSize(m.zozo_size || m.size);
      const origSku = `${m.sqg_banban}${origColor}${origSize}`;
      if (seen.has(origSku)) continue;
      seen.add(origSku);
      rows.push({
        origSku, origBanban: m.sqg_banban, origColor, origSize,
        zozoBanban: m.zozo_banban, zozoColor: toZozoColorId(effectiveColor), zozoSize: toZozoSizeId(effectiveSize),
        name: toZenkakuKana(m.name),
      });
    }
  }

  if (rows.length === 0) {
    alert("対象データがありませんでした。");
    return;
  }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("マスタ登録");
  const headers = ["元SKUコード", "元品番", "元カラー", "元サイズ", "ZOZO品番", "ZOZOカラー", "ZOZOサイズ", "商品名"];
  ws.addRow(headers);
  ws.getRow(1).font = { name: "Meiryo UI", bold: true };
  rows.forEach((r) => {
    ws.addRow([r.origSku, r.origBanban, r.origColor, r.origSize, r.zozoBanban, r.zozoColor, r.zozoSize, r.name]);
  });
  ws.columns.forEach((col) => { col.width = 22; col.font = { name: "Meiryo UI", size: 10 }; });

  const buf = await wb.xlsx.writeBuffer();
  downloadFile(`マスタ登録_${Date.now()}.xlsx`, buf, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");

  const history = tcGetMasterOutputHistory();
  const nextId = history.reduce((max, h) => Math.max(max, h.id), 0) + 1;
  history.push({ id: nextId, timestamp: new Date().toISOString(), rows });
  tcSetMasterOutputHistory(history);
  alert(`${rows.length}件をマスタ登録データとして出力しました。`);
}

function toOutputRow(r) {
  return {
    "SKUキー": r.skuKey, "元品番": r.banban, "元品名": r.originalName ?? r.name, "ZOZO品番": r.zozoBanban, "品名": r.name,
    "サブアイテム": r.subitem, "上代": r.price, "カラーコード": r.color, "サイズコード": r.size, "ステータス": r.status,
  };
}

function refreshAnalysis() {
  const normalized = normalizeRows(state.rawRows, state.columnMapping);
  state.analysisResult = analyze(normalized, state.manualUnions, state.excludedBanbans);
  render();
}
// 変換履歴・登録済み一覧など、品番発行画面以外からmappingを書き換える操作用。
// state.analysisResultは一度計算されたらそのままの内容が表示され続けるため、他画面で
// マッピングを削除・編集しても品番発行画面の統合候補が古いまま（削除したはずの登録済み
// ZOZO品番が候補に残り続ける等）にならないよう、既存の解析結果があれば必ず再計算する。
function refreshAnalysisIfActive() {
  if (state.analysisResult && state.columnMapping) {
    refreshAnalysis();
  } else {
    render();
  }
}
function normalizeRows(rawRows, mapping) {
  return rawRows.map((row) => ({
    banban: row[mapping.banban] ?? "", name: row[mapping.name] ?? "", subitem: row[mapping.subitem] ?? "",
    color: row[mapping.color] ?? "", size: row[mapping.size] ?? "",
    price: mapping.price ? (row[mapping.price] ?? "") : "",
  }));
}

function renderMain() {
  if (state.topTab === "home") return renderHomeScreen();

  if (state.step === "paste") return renderPasteScreen();

        </label>
        ${pickerOpen ? `
          <div class="add-picker">
            <p class="hint">他の候補グループ・単独商品からこのグループに追加する商品を選んでください（元品番単位で追加されます）。</p>

  const mergedReps = buildZozoGroupReps(getMapping()).filter((r) => r.isMerged);

  const OUTPUT_SELECTABLE_STATUSES = new Set(["対象外(複数SKU)", "単独品番(統合対象なし)", "統合候補あり(未確定)", "確定済(単独)"]);

  return `

      ${groupsHtml}
      ${historicalHtml}
      ${manualJoinHtml}
      <h3>出力テーブル（全${rows.length}行）</h3>
      <p class="hint">対象外・単独扱いの行でも、本当は統合したいものがあればチェックして「選択した行を統合候補に追加」を押してください。2件以上選ぶと新しい統合候補グループが上に追加されます。<br>
      統合し漏れて既に確定済みの品番に追加したい場合は、チェックして「選択した行を統合済み品番に追加」を押してください。</p>
      <div class="actions">
        <button data-action="add-selected-to-candidate">選択した行を統合候補に追加</button>
        <button data-action="propose-join-existing">選択した行を統合済み品番に追加</button>
        <button data-action="copy-output">コピー</button>

}

function renderHistoryScreen() {
  const batches = [...getConfirmationBatches()].sort((a, b) => b.id - a.id);
  const historyById = new Map(getHistory().map((h) => [h.id, h]));

  const liveMapping = getMapping();
  const liveByKey = new Map(liveMapping.map((m) => [m.sku_key, m]));
  const { colorMap, sizeMap } = tcGetMasterMap();

  const batchesHtml = batches.map((b) => {
    const expanded = state.openHistoryBatch === b.id;
    const entries = b.historyIds.map((id) => historyById.get(id)).filter(Boolean);
    const rowsHtml = entries.map((h) => `
      <tr>
        <td>${new Date(h.timestamp).toLocaleString("ja-JP")}</td>
        <td>${escapeHtml(h.zozo_banban)}</td>
        <td>${escapeHtml(h.sku_keys.join(", "))}</td>
        <td>${escapeHtml(h.original_banbans.join(", "))}</td>
        <td>${escapeHtml(h.names.join(", "))}</td>
        <td>
          <button data-action="delete-history" data-id="${h.id}">削除</button>
          <button data-action="restore-history-entry" data-id="${h.id}">確定解除をキャンセル（復元）</button>
        </td>
      </tr>
    `).join("");

    // 特定のSKUだけ振替（ZOZO品番/カラー/品名/SKUコード）をやり直せる編集欄。
    // 変換履歴（history）はあくまで確定時点の記録として不変のまま残し、ここでの編集は
    // 現在有効な設定であるmappingだけを直接書き換える（unconfirm-rowと同じ方針）。
    const allSkuKeys = [...new Set(entries.flatMap((h) => h.sku_keys))];
    const editRowsHtml = allSkuKeys.map((sk) => {
      const m = liveByKey.get(sk);
      if (!m) {
        return `<tr><td>${escapeHtml(sk)}</td><td colspan="5" class="hint">（確定解除済み・対象外）</td><td><button data-action="restore-mapping-sku" data-sku-key="${escapeHtml(sk)}">復元</button></td></tr>`;
      }
      if (state.editingMappingKey !== sk) {
        return `
        <tr>
          <td>${escapeHtml(sk)}</td>
          <td>${escapeHtml(m.zozo_banban)}</td>
          <td>${escapeHtml(m.name)}</td>
          <td>${escapeHtml(m.zozo_color || m.color)}</td>
          <td>${escapeHtml(m.zozo_size || m.size)}</td>
          <td>${m.sku_code_override ? escapeHtml(m.sku_code_override) : `<span class="hint">(自動生成)</span>`}</td>
          <td><button data-action="edit-mapping-row" data-sku-key="${escapeHtml(sk)}">振替を編集</button></td>
        </tr>`;
      }
      return `
      <tr>
        <td colspan="7">
          <div class="add-picker">
            <label class="hint">ZOZO品番
              <input type="text" id="edit-zozo-banban" value="${escapeHtml(m.zozo_banban)}">
            </label>
            <label class="hint">品名
              <input type="text" id="edit-name" value="${escapeHtml(m.name)}">
            </label>
            <label class="hint">SKU用カラー
              <select id="edit-zozo-color">${colorOptionsHtml(colorMap, m.zozo_color || m.color)}</select>
            </label>
            <label class="hint">SKU用サイズ
              <select id="edit-zozo-size">${sizeOptionsHtml(sizeMap, m.zozo_size || m.size)}</select>
            </label>
            <label class="hint">SKUコード直接入力（優先・空欄なら自動生成に戻る）
              <input type="text" id="edit-sku-override" value="${escapeHtml(m.sku_code_override || "")}" placeholder="例: 12345600101">
            </label>
            <p class="hint">SKUコードを直接入力すると、タグ発行・納品書のSKUコードはZOZOカラー/サイズからの自動生成ではなく、ここで入力した値がそのまま優先的に使われます。</p>
            <div class="candidate-actions">
              <button class="primary" data-action="save-mapping-edit" data-sku-key="${escapeHtml(sk)}">保存</button>
              <button data-action="cancel-mapping-edit">キャンセル</button>
            </div>
          </div>
        </td>
      </tr>`;
    }).join("");

    return `
      <div class="candidate-card">
        <div class="candidate-header">確定日時: ${new Date(b.timestamp).toLocaleString("ja-JP")}（統合・単独確定 ${entries.length}件${b.allRows ? ` / 全${b.allRows.length}行` : ""}）</div>
        <div class="actions">
          <button data-action="toggle-history-batch" data-batch-id="${b.id}">${expanded ? "内容を閉じる" : "内容を見る"}</button>
          <button class="primary" data-action="generate-master-for-batch" data-batch-id="${b.id}">マスタ登録発行</button>
          <button data-action="delete-history-batch" data-batch-id="${b.id}">このバッチを削除</button>
        </div>
        ${expanded ? `
          <div class="table-scroll">
            <table>
              <thead><tr><th>日時</th><th>ZOZO品番</th><th>対象SKUキー</th><th>対象元品番</th><th>品名</th><th></th></tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          <h4>SKUごとの振替（現在の設定・編集可）</h4>
          <div class="table-scroll">
            <table>
              <thead><tr><th>SKUキー</th><th>ZOZO品番</th><th>品名</th><th>SKU用カラー</th><th>SKU用サイズ</th><th>SKUコード直接入力</th><th></th></tr></thead>
              <tbody>${editRowsHtml}</tbody>
            </table>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");

  return `
    <div class="screen">
      <h2>変換履歴</h2>
      <p class="hint">「品番発行」画面で「確定」を押すたびに、その回に確定した統合・単独確定の内容が1つのバッチとして下に記録されます。</p>
      <div class="actions">
        <button data-action="clear-history" ${batches.length === 0 ? "disabled" : ""}>全履歴をクリア</button>
      </div>
      ${batches.length === 0 ? `<p class="hint">履歴はまだありません。</p>` : batchesHtml}
    </div>
  `;
}

// 「既に登録済みの商品」を、ZOZO品番でくくらず1SKU1行のフラットな表として
// 一覧・検索・削除できる画面（単独確定分も含め全件）。ここでの削除はunconfirm-rowと
// 同じ方針でmappingだけを解除する（変換履歴＝監査ログはそのまま残す）。
// 品番統合画面の候補（historicalSuggestions）はここと同じgetMapping()を毎回読み直して
// 作られるため、削除・編集すれば統合画面側の候補にも即座に反映される
// （refreshAnalysisIfActiveで、開いたままの解析結果があれば再計算する）。
function renderRegisteredScreen() {
  const mapping = getMapping();
  const sorted = [...mapping].sort((a, b) =>
    (a.zozo_banban || "").localeCompare(b.zozo_banban || "") || (a.sku_key || "").localeCompare(b.sku_key || "")
  );
  const filterRaw = (state.registeredFilter || "").trim().toLowerCase();
  const filtered = !filterRaw ? sorted : sorted.filter((m) => {
    const haystack = [m.zozo_banban, m.sqg_banban, m.name, m.original_name, m.sku_key].join(" ").toLowerCase();
    return haystack.includes(filterRaw);
  });
  const { colorMap, sizeMap } = tcGetMasterMap();
  const COLS = 14;

  const rowsHtml = filtered.map((m) => {
    if (state.editingMappingKey !== m.sku_key) {
      return `
      <tr>
        <td><input type="checkbox" class="registered-check" data-sku-key="${escapeHtml(m.sku_key)}"></td>
        <td>${escapeHtml(m.zozo_banban)}</td>
        <td>${escapeHtml(m.sku_key)}</td>
        <td>${escapeHtml(m.sqg_banban)}</td>
        <td>${escapeHtml(m.original_name || m.name)}</td>
        <td>${escapeHtml(m.name)}</td>
        <td>${escapeHtml(m.subitem)}</td>
        <td>${escapeHtml(m.price)}</td>
        <td>${escapeHtml(m.zozo_color || m.color)}</td>
        <td>${escapeHtml(m.zozo_size || m.size)}</td>
        <td>${m.sku_code_override ? escapeHtml(m.sku_code_override) : `<span class="hint">(自動生成)</span>`}</td>
        <td>${m.merged_with && m.merged_with.length > 0 ? `統合（${m.merged_with.length + 1}件）` : "単独"}</td>
        <td>${m.confirmed_at ? new Date(m.confirmed_at).toLocaleString("ja-JP") : "-"}</td>
        <td>
          <button data-action="edit-mapping-row" data-sku-key="${escapeHtml(m.sku_key)}">振替を編集</button>
          <button data-action="delete-registered-sku" data-sku-key="${escapeHtml(m.sku_key)}">削除</button>
        </td>
      </tr>`;
    }
    return `
    <tr>
      <td colspan="${COLS}">
        <div class="add-picker">
          <label class="hint">ZOZO品番
            <input type="text" id="edit-zozo-banban" value="${escapeHtml(m.zozo_banban)}">
          </label>
          <label class="hint">品名
            <input type="text" id="edit-name" value="${escapeHtml(m.name)}">
          </label>
          <label class="hint">SKU用カラー
            <select id="edit-zozo-color">${colorOptionsHtml(colorMap, m.zozo_color || m.color)}</select>
          </label>
          <label class="hint">SKU用サイズ
            <select id="edit-zozo-size">${sizeOptionsHtml(sizeMap, m.zozo_size || m.size)}</select>
          </label>
          <label class="hint">SKUコード直接入力（優先・空欄なら自動生成に戻る）
            <input type="text" id="edit-sku-override" value="${escapeHtml(m.sku_code_override || "")}">
          </label>
          <div class="candidate-actions">
            <button class="primary" data-action="save-mapping-edit" data-sku-key="${escapeHtml(m.sku_key)}">保存</button>
            <button data-action="cancel-mapping-edit">キャンセル</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join("");

  return `
    <div class="screen">
      <h2>登録済み一覧</h2>
      <p class="hint">現在マッピングとして有効な（統合・単独確定済みの）SKUを、ZOZO品番でくくらず1行ずつ全件一覧できます。ここで削除・編集すると品番統合画面の候補にも即座に反映されます。削除するとそのSKUは確定前の状態に戻り、次回同じデータを貼り付けると未確定として扱われます（変換履歴の記録自体は監査ログとして残ります）。</p>
      <div class="actions">
        <input type="text" id="registered-filter-input" placeholder="ZOZO品番・元品番・品名・SKUキーで絞り込み" value="${escapeHtml(state.registeredFilter)}">
        <button data-action="search-registered">絞り込み</button>
        <button data-action="clear-registered-filter">クリア</button>
        <button data-action="delete-selected-registered">選択した行を削除</button>
        <span class="hint">${filtered.length}件 / 全${mapping.length}件</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th></th><th>ZOZO品番</th><th>SKUキー</th><th>元品番</th><th>元品名</th><th>品名</th>
              <th>サブアイテム</th><th>上代</th><th>SKU用カラー</th><th>SKU用サイズ</th><th>SKUコード直接入力</th>
              <th>状態</th><th>確定日時</th><th></th>
            </tr>
          </thead>
          <tbody>${rowsHtml || `<tr><td colspan="${COLS}" class="hint">${mapping.length === 0 ? "登録済みの商品はまだありません。" : "条件に一致する登録済み商品がありません。"}</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderTcConvertPanel() {
  const result = state.tcResult;
  let resultHtml = "";
  if (result) {
    const headers = ["呼び出しNo.", "呼び出しデータ名", "検索用呼び出し名", "メーカー", "品番", "JANコード", "ZOZOカラーID", "ZOZOサイズID", "SKUコード", "カラー名", "サイズ名"];
    const bodyRows = result.rows.map((r, i) => {
      const st = result.statuses[i];
      return `<tr>${r.map((v) => `<td>${escapeHtml(String(v))}</td>`).join("")}<td ${st.ok ? 'class="hint"' : 'style="color:#ff6b6b"'}>${escapeHtml(st.text)}</td></tr>`;
    }).join("");
    const unmappedCount = result.statuses.filter((s) => !s.ok).length;
    const warn = result.mappingCount === 0
      ? `<p class="error">このPC（このURL）にはマッピングが1件もありません。ドライブから読み込むか、バックアップを復元してください。</p>`
      : unmappedCount > 0
        ? `<p class="error">${unmappedCount}件は変換できず、元品番のまま出力されています（右端の「変換状況」を確認してください）。</p>`
        : "";
    resultHtml = `
      <h3>変換結果</h3>
      <p class="hint">${result.rowNum}件変換${result.errCount ? `（${result.errCount}行スキップ）` : ""}</p>
      ${warn}
      <div class="table-scroll"><table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}<th>変換状況</th></tr></thead><tbody>${bodyRows}</tbody></table></div>
      <div class="actions">
        <span class="hint">納品書番号</span>
        <input type="text" id="tc-invoice-no" value="${escapeHtml(tcGetNextInvoiceNo())}">
        <button class="primary" data-action="tc-generate-invoice">納品書発行</button>
        <button data-action="tc-copy">変換結果をコピー</button>
      </div>
    `;
  } else {
    resultHtml = `<p class="hint">データを貼り付けて「変換実行」を押してください。</p>`;
  }
  return `
    <p class="hint">入力列順：No. / 呼び出しデータ名 / 検索用呼び出し名 / メーカー / 品番 / JAN / 品名 / 価格 / カラー名(削除) / Cコード / Sコード<br>
    SKUコード = 品番 + ZOZOカラーID + ZOZOサイズID（カラー・サイズマスタで自社コードから変換）</p>
    <textarea id="tc-input-area" rows="10" placeholder="システムのタグ発行データをそのまま貼り付け..."></textarea>
    <div class="actions">
      <button class="primary" data-action="tc-convert">変換実行</button>
      <button data-action="tc-clear">クリア</button>
    </div>
    ${resultHtml}
  `;
}

/* ================= Googleドライブ連携 =================
   データ（バックアップJSONと同じ内容）をドライブ上の1ファイルに保管する。
   ・起動時：連携済みなら自動でドライブから読み込む（初回のみファイル選択のポップアップが出る）
   ・「ドライブに書き込み」ボタンを押したときだけ、ドライブ上のファイルを上書きする
   Google認証は file:// では動かないため、https のURLで開いた場合のみ使える。 */
function buildBackupObject() {
  const master = tcLoadMaster();
  return {
    settings: getSettings(), mapping: getMapping(), history: getHistory(),
    registeredBanbans: getRegisteredBanbans(), masterOutputHistory: tcGetMasterOutputHistory(),
    confirmationBatches: getConfirmationBatches(),
    colorMaster: master.color, sizeMaster: master.size,
    exportedAt: new Date().toISOString(),
  };
}
function applyBackupObject(data) {
  if (data.settings) setSettings(data.settings);
  if (data.mapping) setMapping(data.mapping);
  if (data.history) setHistory(data.history);
  if (data.registeredBanbans) setRegisteredBanbans(data.registeredBanbans);
  if (data.masterOutputHistory) tcSetMasterOutputHistory(data.masterOutputHistory);
  if (data.confirmationBatches) setConfirmationBatches(data.confirmationBatches);
  if (data.colorMaster || data.sizeMaster) {
    const current = tcLoadMaster();
    tcSaveMaster(data.colorMaster || current.color, data.sizeMaster || current.size);
  }
}

const cloudUi = { msg: "", busy: false, error: false };
let cloudToken = null, cloudTokenExpiry = 0, cloudTokenClient = null;
function cloudAvailable() { return location.protocol !== "file:"; }
function cloudGet(key) { return localStorage.getItem(key); }
function cloudSet(key, value) { localStorage.setItem(key, value); }

function renderCloudBar() {
  if (!cloudAvailable()) {
    return `<div id="cloud-bar" class="cloud-bar"><span class="hint">☁ ドライブ連携は、httpsのURL（tools.chelsea-ny.com）で開いた場合のみ使えます。</span></div>`;
  }
  const linked = !!cloudGet(CLOUD.KEY_FILE_ID);
  const dirty = cloudGet(CLOUD.KEY_DIRTY) === "1";
  const synced = cloudGet(CLOUD.KEY_SYNCED);
  const dis = cloudUi.busy ? "disabled" : "";
  let status;
  if (cloudUi.msg) status = `<span class="${cloudUi.error ? "error" : ""}" style="margin:0">${escapeHtml(cloudUi.msg)}</span>`;
  else if (linked) status = `☁ ドライブ連携中${synced ? `（最終同期: ${new Date(synced).toLocaleString("ja-JP")}）` : ""}`;
  else status = `☁ ドライブ未連携（初回のみ設定が必要です）`;
  const dirtyBadge = linked && dirty ? ` <span class="cloud-dirty">● ドライブに未書き込みの変更あり</span>` : "";
  const buttons = linked
    ? `<button data-action="cloud-read" ${dis}>ドライブから読み込み</button>
       <button class="primary" data-action="cloud-write" ${dis}>ドライブに書き込み</button>
       <button data-action="cloud-unlink" ${dis}>連携解除</button>`
    : `<button data-action="cloud-pick" ${dis}>ドライブのデータファイルを選ぶ</button>
       <button data-action="cloud-create" ${dis}>新規作成して書き込む</button>`;
  return `<div id="cloud-bar" class="cloud-bar"><span class="cloud-msg">${status}${dirtyBadge}</span>${buttons}</div>`;
}
function refreshCloudBar() {
  const el = document.getElementById("cloud-bar");
  if (el) el.outerHTML = renderCloudBar();
}
function cloudBusy(msg) { cloudUi.busy = true; cloudUi.msg = msg; cloudUi.error = false; refreshCloudBar(); }
function cloudDone(msg, isError) { cloudUi.busy = false; cloudUi.msg = msg || ""; cloudUi.error = !!isError; refreshCloudBar(); }

function cloudWaitForScripts(needPicker) {
  return new Promise((resolve, reject) => {
    const started = Date.now();
    (function check() {
      if (window.google && google.accounts && google.accounts.oauth2 && (!needPicker || window.gapi)) { resolve(); return; }
      if (Date.now() - started > 10000) { reject(new Error("Googleのスクリプトを読み込めませんでした（ネットワークを確認してください）")); return; }
      setTimeout(check, 200);
    })();
  });
}
function cloudGetToken() {
  if (cloudToken && Date.now() < cloudTokenExpiry - 60000) return Promise.resolve(cloudToken);
  return cloudWaitForScripts(false).then(() => new Promise((resolve, reject) => {
    if (!cloudTokenClient) {
      cloudTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLOUD.CLIENT_ID, scope: CLOUD.SCOPE, callback: () => {},
      });
    }
    cloudTokenClient.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      cloudToken = resp.access_token;
      cloudTokenExpiry = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
      cloudSet(CLOUD.KEY_CONSENTED, "1");
      resolve(cloudToken);
    };
    cloudTokenClient.error_callback = (err) => reject(new Error(err.type || "ログインに失敗しました"));
    cloudTokenClient.requestAccessToken({ prompt: cloudGet(CLOUD.KEY_CONSENTED) ? "" : "consent" });
  }));
}
async function cloudFetch(url, options = {}) {
  const resp = await fetch(url, { ...options, headers: { Authorization: `Bearer ${cloudToken}`, ...(options.headers || {}) } });
  if (!resp.ok) {
    if (resp.status === 401) cloudToken = null;
    const err = new Error(`Googleドライブのエラー（${resp.status}）`);
    err.status = resp.status;
    throw err;
  }
  return resp;
}
async function cloudGetMeta(fileId) {
  const r = await cloudFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?fields=id,name,modifiedTime,trashed,capabilities(canEdit)`);
  return r.json();
}
function cloudPickFile() {
  return cloudWaitForScripts(true).then(() => new Promise((resolve, reject) => {
    gapi.load("picker", () => {
      const mine = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setMimeTypes("application/json").setIncludeFolders(false).setOwnedByMe(true);
      const shared = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setMimeTypes("application/json").setIncludeFolders(false).setOwnedByMe(false);
      new google.picker.PickerBuilder()
        .setAppId(CLOUD.PROJECT_NUMBER)
        .setOAuthToken(cloudToken)
        .setDeveloperKey(CLOUD.API_KEY)
        .setTitle(`「${CLOUD.FILE_NAME}」を選択してください`)
        .addView(mine)
        .addView(shared)
        .setCallback((data) => {
          if (data.action === google.picker.Action.PICKED) resolve(data.docs[0].id);
          else if (data.action === google.picker.Action.CANCEL) reject(new Error("ファイルの選択がキャンセルされました"));
        })
        .build()
        .setVisible(true);
    });
  }));
}

// ドライブ → このPC。auto=true は起動時の自動読み込み（ポップアップを開かない）。
async function cloudRead(auto) {
  const fileId = cloudGet(CLOUD.KEY_FILE_ID);
  if (!fileId) return;
  cloudBusy("ドライブからデータを読み込み中...");
  try {
    await cloudGetToken();
    let meta;
    try {
      meta = await cloudGetMeta(fileId);
    } catch (err) {
      if (err.status !== 403 && err.status !== 404) throw err;
      // このGoogleアカウントにはまだファイルへのアクセスが許可されていない → 初回のみピッカーで選んでもらう
      if (auto) { cloudDone("このアカウントでは最初にファイルの選択が必要です。「連携解除」→「ドライブのデータファイルを選ぶ」を押してください。", true); return; }
      const pickedId = await cloudPickFile();
      cloudSet(CLOUD.KEY_FILE_ID, pickedId);
      meta = await cloudGetMeta(pickedId);
    }
    if (meta.trashed) throw new Error("ドライブ上のデータファイルがゴミ箱に入っています");
    if (cloudGet(CLOUD.KEY_DIRTY) === "1") {
      if (!confirm("このPCには、ドライブに未書き込みの変更があります。ドライブの内容で上書きすると、その変更は失われます。\n上書きしますか？\n（キャンセルすると、このPCのデータをそのまま使います）")) {
        cloudDone("読み込みをキャンセルしました（このPCのデータを使用中）");
        return;
      }
    }
    const resp = await cloudFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(meta.id)}?alt=media`);
    const data = JSON.parse(await resp.text());
    if (!data || typeof data !== "object") throw new Error("データファイルの形式が正しくありません");
    cloudApplying = true;
    try { applyBackupObject(data); } finally { cloudApplying = false; }
    cloudSet(CLOUD.KEY_SYNCED, meta.modifiedTime);
    cloudSet(CLOUD.KEY_DIRTY, "0");
    refreshAnalysisIfActive();
    cloudDone(`ドライブから読み込みました（${new Date(meta.modifiedTime).toLocaleString("ja-JP")} 更新分）`);
  } catch (err) {
    cloudDone(cloudErrorMessage(err, auto), true);
  }
}

// このPC → ドライブ（ボタンを押したときだけ）
async function cloudWrite() {
  const fileId = cloudGet(CLOUD.KEY_FILE_ID);
  if (!fileId) return;
  cloudBusy("ドライブに書き込み中...");
  try {
    await cloudGetToken();
    const meta = await cloudGetMeta(fileId);
    if (meta.capabilities && meta.capabilities.canEdit === false) {
      throw new Error("このファイルは閲覧のみで共有されています。書き込むには、管理者に編集権限をもらってください");
    }
    if (cloudGet(CLOUD.KEY_SYNCED) !== meta.modifiedTime) {
      if (!confirm("ドライブ上のデータは、このPCが最後に読み込んだ後に更新されています（他のPCが書き込んだ可能性があります）。\n書き込むと、その変更は上書きされて失われます。それでも書き込みますか？")) {
        cloudDone("書き込みをキャンセルしました");
        return;
      }
    }
    const resp = await cloudFetch(
      `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media&fields=id,modifiedTime`,
      { method: "PATCH", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: JSON.stringify(buildBackupObject()) }
    );
    const result = await resp.json();
    cloudSet(CLOUD.KEY_SYNCED, result.modifiedTime);
    cloudSet(CLOUD.KEY_DIRTY, "0");
    cloudDone(`ドライブに書き込みました（${new Date(result.modifiedTime).toLocaleString("ja-JP")}）`);
  } catch (err) {
    cloudDone(cloudErrorMessage(err, false), true);
  }
}

// 初回（管理者）：このPCの現在のデータでドライブ上に新規ファイルを作る
async function cloudCreate() {
  if (cloudGet(CLOUD.KEY_FILE_ID) && !confirm("既に連携しているファイルがあります。新しいファイルを作成して連携先を切り替えますか？")) return;
  if (!confirm(`Googleドライブ（マイドライブ直下）に「${CLOUD.FILE_NAME}」を新規作成し、このPCの現在のデータを書き込みます。よろしいですか？`)) return;
  cloudBusy("ドライブにファイルを作成中...");
  try {
    await cloudGetToken();
    const boundary = `zozo${Date.now()}`;
    const metadata = JSON.stringify({ name: CLOUD.FILE_NAME, mimeType: "application/json" });
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n`
      + `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(buildBackupObject())}\r\n--${boundary}--`;
    const resp = await cloudFetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime",
      { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body }
    );
    const result = await resp.json();
    cloudSet(CLOUD.KEY_FILE_ID, result.id);
    cloudSet(CLOUD.KEY_SYNCED, result.modifiedTime);
    cloudSet(CLOUD.KEY_DIRTY, "0");
    cloudDone(`「${CLOUD.FILE_NAME}」を作成しました。Googleドライブでスタッフに共有してください（編集権限＝書き込み可、閲覧のみ＝読み込み専用）。`);
  } catch (err) {
    cloudDone(cloudErrorMessage(err, false), true);
  }
}

// 初回（スタッフ・別PC）：ドライブ上の既存ファイルをピッカーで選んで読み込む
async function cloudPick() {
  cloudBusy("Googleにログイン中...");
  try {
    await cloudGetToken();
    cloudUi.msg = "表示された画面でデータファイルを選んでください";
    refreshCloudBar();
    const fileId = await cloudPickFile();
    cloudSet(CLOUD.KEY_FILE_ID, fileId);
    cloudSet(CLOUD.KEY_SYNCED, "");
    await cloudRead(false);
  } catch (err) {
    cloudDone(cloudErrorMessage(err, false), true);
  }
}
function cloudUnlink() {
  [CLOUD.KEY_FILE_ID, CLOUD.KEY_SYNCED].forEach((k) => localStorage.removeItem(k));
  cloudDone("連携を解除しました");
}
function cloudErrorMessage(err, auto) {
  const m = String((err && err.message) || err);
  if (/popup|access_denied|immediate_failed|user_logged_out|interaction_required/i.test(m)) {
    return auto ? "自動ログインできませんでした。「ドライブから読み込み」を押してください。" : "Googleのログインがキャンセルされました。";
  }
  return m;
}

// 起動時：連携済み（ログイン同意済み）なら、自動でドライブから読み込む。
async function cloudStartup() {
  if (!cloudAvailable() || !cloudGet(CLOUD.KEY_FILE_ID)) return;
  if (!cloudGet(CLOUD.KEY_CONSENTED)) { cloudDone("「ドライブから読み込み」を押してください"); return; }
  await cloudRead(true);
}

/* ================= ZOZO売上変換 =================
   ZOZOのシステムから出力した売上CSV（Shift-JIS、19列）を、自社システム取り込み用の
   11列CSVに変換する。これまでExcelで「ZOZO売上取り込み.xlsx」のシートに貼り付けて
   Sheet1の数式で変換していた処理と同じ内容：
     店舗コード=9000固定 / 伝票区分=販売タイプが「通常」なら1、それ以外は「不明」 /
     伝票日付=注文日 / レシート番号=連番 / SKUコード=空 / JANコード=バーコード（前後空白除去） /
     PS区分=価格タイプが「セール」ならS、それ以外はP / 数量=注文数 / 販売単価=販売価格（税抜） /
     販売員コード=999999 / 顧客コード=999999
   複数ファイルは、2つ目以降のヘッダー行を除いて1つ目の下にそのまま連結し、
   レシート番号は全体で通し番号にする。 */
const SALES_OUT_HEADERS = ["店舗コード", "伝票区分", "伝票日付", "レシート番号", "SKUコード", "JANコード", "PS区分", "数量", "販売単価", "販売員コード", "顧客コード"];
const SALES_REQUIRED_COLS = ["販売価格（税抜）", "販売タイプ", "価格タイプ", "注文数", "注文日", "バーコード"];

function salesDecodeBytes(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("shift_jis").decode(buf); }
}
// ダブルクォート・クォート内の改行/カンマに対応した最小限のCSVパーサー
function salesParseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      rows.push(row); row = [];
    } else field += c;
  }
  if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((v) => v.trim() !== ""));
}
// 1ファイル分を、変換に必要な項目だけを持つ行の配列にする
function salesParseFile(name, text) {
  const rows = salesParseCsv(text);
  if (rows.length === 0) throw new Error(`${name}: 空のファイルです`);
  const header = rows[0].map((h) => h.trim());
  const idx = {};
  const missing = [];
  for (const col of SALES_REQUIRED_COLS) {
    idx[col] = header.indexOf(col);
    if (idx[col] < 0) missing.push(col);
  }
  if (missing.length > 0) throw new Error(`${name}: 必要な列が見つかりません（${missing.join("、")}）。ZOZOの売上CSVか確認してください`);
  const data = rows.slice(1).map((r) => ({
    sellType: (r[idx["販売タイプ"]] ?? "").trim(),
    priceType: (r[idx["価格タイプ"]] ?? "").trim(),
    qty: (r[idx["注文数"]] ?? "").trim(),
    price: (r[idx["販売価格（税抜）"]] ?? "").trim(),
    date: (r[idx["注文日"]] ?? "").trim(),
    jan: (r[idx["バーコード"]] ?? "").trim(),
  }));
  return { name, rows: data };
}
function salesConvert(files) {
  const out = [];
  const warnings = { unknownType: 0, otherPriceType: 0, noJan: 0 };
  let n = 0;
  for (const f of files) {
    for (const r of f.rows) {
      n++;
      if (r.sellType !== "通常") warnings.unknownType++;
      if (r.priceType !== "セール" && r.priceType !== "プロパー") warnings.otherPriceType++;
      if (!r.jan) warnings.noJan++;
      out.push([
        "9000", r.sellType === "通常" ? "1" : "不明", r.date, String(n), "", r.jan,
        r.priceType === "セール" ? "S" : "P", r.qty, r.price, "999999", "999999",
      ]);
    }
  }
  const dates = out.map((r) => r[2]).filter(Boolean).sort();
  return { rows: out, warnings, minDate: dates[0] || "", maxDate: dates[dates.length - 1] || "" };
}
function salesCsvField(v) {
  return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
}
function salesToCsv(rows, withHeader) {
  const lines = [];
  if (withHeader) lines.push(SALES_OUT_HEADERS.map(salesCsvField).join(","));
  rows.forEach((r) => lines.push(r.map(salesCsvField).join(",")));
  return lines.join("\r\n") + "\r\n";
}
// ブラウザ標準ではShift-JISへのエンコードができないため、デコーダーから逆引き表を作る
let SJIS_ENCODE_MAP = null;
function salesBuildSjisMap() {
  const map = new Map();
  const dec = new TextDecoder("shift_jis");
  for (let b = 0xA1; b <= 0xDF; b++) map.set(dec.decode(new Uint8Array([b])), [b]);
  const leads = [];
  for (let l = 0x81; l <= 0x9F; l++) leads.push(l);
  for (let l = 0xE0; l <= 0xFC; l++) leads.push(l);
  for (const l of leads) {
    for (let t = 0x40; t <= 0xFC; t++) {
      if (t === 0x7F) continue;
      const s = dec.decode(new Uint8Array([l, t]));
      if (s.length === 1 && s !== "�" && !map.has(s)) map.set(s, [l, t]);
    }
  }
  return map;
}
function salesEncodeShiftJis(str) {
  if (!SJIS_ENCODE_MAP) SJIS_ENCODE_MAP = salesBuildSjisMap();
  const bytes = [], unmapped = [];
  for (const ch of str) {
    const code = ch.codePointAt(0);
    if (code < 0x80) bytes.push(code);
    else if (SJIS_ENCODE_MAP.has(ch)) bytes.push(...SJIS_ENCODE_MAP.get(ch));
    else { bytes.push(0x3F); unmapped.push(ch); }
  }
  return { bytes: new Uint8Array(bytes), unmapped };
}
function salesOutputFileName(result) {
  const range = result.minDate && result.maxDate && result.minDate !== result.maxDate ? `${result.minDate}-${result.maxDate}` : (result.minDate || "");
  return `ZOZO売上取り込み_${range || Date.now()}.csv`;
}

async function salesAddFiles(fileList) {
  const errors = [];
  for (const file of fileList) {
    if (state.sales.files.some((f) => f.name === file.name)) continue;
    try {
      const parsed = salesParseFile(file.name, salesDecodeBytes(await file.arrayBuffer()));
      state.sales.files.push(parsed);
    } catch (err) {
      errors.push(err.message);
    }
  }
  // 日付順（ファイル名順）に並べて連結する
  state.sales.files.sort((a, b) => a.name.localeCompare(b.name));
  state.sales.error = errors.join("\n");
  render();
}
